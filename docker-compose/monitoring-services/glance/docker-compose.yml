services:
  glance:
    # Pinned like every other stack: glance main moves fast.
    image: glanceapp/glance:v0.8.7@sha256:bc5a392672c1ec8823c50b61f3bd4b7e5acc34fcbb8477862577b3af1c633875
    container_name: glance
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=${TZ:-Etc/UTC}
      # glance.yml keeps ${...} placeholders; these resolve them at startup.
      - GLANCE_SECRET_KEY=${GLANCE_SECRET_KEY:?GLANCE_SECRET_KEY is required}
      - GLANCE_ADMIN_PASSWORD=${GLANCE_ADMIN_PASSWORD:?GLANCE_ADMIN_PASSWORD is required}
      # Read-only token for the GPU panel's JSON API.
      - GPU_PANEL_TOKEN=${GPU_PANEL_TOKEN:?GPU_PANEL_TOKEN is required}
    volumes:
      # Whole directory on purpose: a rewritten bind-mounted file keeps its old
      # inode and Glance would watch the stale one.
      - ./config:/app/config
