services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.size=3GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./rules:/etc/prometheus/rules:ro
      - ./data:/prometheus
    networks:
      - homelab_monitoring
    ports:
      - "9090:9090"

  # Turns firing rules into messages. No published port: Prometheus and amtool
  # reach it on the shared network.
  alertmanager:
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    container_name: alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Silences and notification state survive a restart for five days.
      - --data.retention=120h
    volumes:
      # Rendered 0600: it carries the bot token.
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager:/alertmanager
    networks:
      - homelab_monitoring

# Shared with the grafana stack; without it `prometheus:9090` resolves to the
# reverse proxy instead of to this container.
networks:
  homelab_monitoring:
    external: true
