services:
  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.size=3GB
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./rules:/etc/prometheus/rules:ro
      - ./data:/prometheus
    networks:
      - homelab_monitoring
    ports:
      - "9090:9090"

volumes:
  prometheus_data:

# Shared with the grafana stack (declared in host_vars/monitoring.yml and created
# by roles/stacks). Without it each project gets its own network and Grafana's
# `http://prometheus:9090` datasource resolves through DNS to the reverse proxy
# instead of to this container.
networks:
  homelab_monitoring:
    external: true
