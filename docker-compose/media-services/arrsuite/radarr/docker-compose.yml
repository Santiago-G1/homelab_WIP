services:
  radarr:
    image: lscr.io/linuxserver/radarr:6.4.4.10685-ls318@sha256:adb6c09d6b729ea5e642c99cea35af72702ef476bf4763f153299ac5db9f0b4f
    container_name: radarr
    environment:
      - PUID=${PUID:?}
      - PGID=${PGID:?}
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./data:/config
      - ${DATA_MOUNT:?DATA_MOUNT is required}:/data
    ports:
      - "${PUBLISH_PORT:?}:7878"
    networks:
      - arrsuite-stack
    restart: unless-stopped

networks:
  arrsuite-stack:
    external: true
