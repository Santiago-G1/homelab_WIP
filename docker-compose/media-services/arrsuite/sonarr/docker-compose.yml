services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls325@sha256:a5c1a5fecbef946927ab90ad68df319ac5fe644057e5fc18cd993f01ac07b2b2
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /opt/docker/sonarr/data:/config
      - /mnt/data:/data
    ports:
      - "8989:8989"
    networks:
      - arrsuite-stack
    restart: unless-stopped

networks:
  arrsuite-stack:
    external: true
