services:
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    container_name: seerr
    environment:
      - LOG_LEVEL=debug
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "5055:5055"
    volumes:
      - /opt/docker/seerr/data:/app/config
    networks:
      - soulsync-network
    restart: unless-stopped

networks:
  soulsync-network:
    external: true
