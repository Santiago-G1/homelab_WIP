services:
  slskd:
    image: slskd/slskd:latest@sha256:588af49abc3088d639c8f1174d3bfad6e92c093a275a593140e3ac9311ebf6c4
    container_name: slskd
    environment:
      - TZ=${TZ:-Etc/UTC}
      - PUID=1000
      - PGID=1000   
      - SLSKD_REMOTE_CONFIGURATION=true
      - SLSKD_API_KEY=${SLSKD_API_KEY:?SLSKD_API_KEY is required}
      - SLSKD_SLSK_USERNAME=${SLSKD_USERNAME:?SLSKD_USERNAME is required}
      - SLSKD_SLSK_PASSWORD=${SLSKD_PASSWORD:?SLSKD_PASSWORD is required}
    volumes:
      - /opt/docker/slskd/data:/app
      - /mnt/data/music:/music
    ports:
      - "5030:5030"
      - "5031:5031"
      - "50300:50300"
    networks:
      - soulsync-network
    restart: always

networks:
  soulsync-network:
    external: true
