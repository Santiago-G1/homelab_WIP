services:
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:2.6.5.5623-ls162@sha256:f2b26429893d4c4cb71941b7ee50b1bdecd9d5f9f9e02d5410615e9f4f7c8d95
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - /opt/docker/prowlarr/data:/config
      - /mnt/data:/data
    ports:
      - "9696:9696"
    networks:
      - soulsync-network
    restart: unless-stopped

networks:
  soulsync-network:
    external: true
