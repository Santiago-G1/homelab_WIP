services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=${TZ:-Etc/UTC}
    ports:
      - "8191:8191"
    networks:
      - soulsync-network
    restart: unless-stopped

networks:
  soulsync-network:
    external: true
