services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - TZ=Etc/UTC
    volumes:
      - ./config:/config
      - /mnt/media/series:/data/tvshows
      - /mnt/media/movies:/data/movies
    ports:
      - 8096:8096
    # Intel iGPU (Ivy Bridge) render node, passed through to the LXC by
    # terraform/proxmox/lxc_media.tf. It belongs to gid 44 (video) there, and
    # the image runs Jellyfin as uid 911 (abc), which is not in that group.
    # jellyfin-ffmpeg ships the i965 VAAPI driver this generation needs.
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128
    group_add:
      - "44"
    restart: unless-stopped
