services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    environment:
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_LOGLEVEL=info
      - TZ=Etc/UTC
    volumes:
      - ./config:/data
      - /mnt/media/music:/music:ro
    ports:
      - 4533:4533
    restart: unless-stopped
