services:
  navidrome:
    image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
    container_name: navidrome
    environment:
      - ND_MUSICFOLDER=/music
      - ND_DATAFOLDER=/data
      - ND_LOGLEVEL=info
      - TZ=${TZ:-Etc/UTC}
    volumes:
      - ./config:/data
      - /mnt/media/music:/music:ro
    ports:
      - 4533:4533
    restart: unless-stopped
