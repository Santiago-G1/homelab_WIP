services:
  blocky:
    image: spx01/blocky:v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
    container_name: blocky
    restart: unless-stopped
    ports:
      - "53:53/tcp"   # DNS
      - "53:53/udp"
      - "80:80"       # REST API, DoH (/dns-query) and metrics
      - "4000:4000"   # same, on a second port for the reverse proxy
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./querylog:/app/querylog
    environment:
      - TZ=${TZ:-Etc/UTC}
      - DOMAINNAME_HS=${DOMAINNAME_HS:?DOMAINNAME_HS is required}
