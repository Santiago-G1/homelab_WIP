services:
  # Vaultwarden Password Manager
  vaultwarden:
    image: vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055
    container_name: vaultwarden
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    # profiles: ["core", "all"]
    environment:
      - DOMAIN=https://password.${DOMAINNAME_HS}
    # Reached by the reverse proxy on another container, so publish the port.
    ports:
      - "8000:80"
    volumes:
      - ./config:/data
