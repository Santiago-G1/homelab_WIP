<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPU Control · Iniciar sesión</title>
<style>
  :root { --bg:#0e1116; --card:#171c24; --line:#252c38; --fg:#e6e9ef; --mut:#8b95a5;
          --ok:#3fb950; --bad:#f85149; --acc:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg);
         font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
         display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { width:100%; max-width:360px; background:var(--card); border:1px solid var(--line);
         border-radius:12px; padding:22px; }
  h1 { margin:0 0 4px; font-size:16px; font-weight:600; display:flex; align-items:center; gap:9px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--acc); }
  p.sub { margin:0 0 18px; color:var(--mut); font-size:12px; }
  label { display:block; font-size:12px; color:var(--mut); margin:12px 0 5px; }
  input { width:100%; background:#0b0e13; color:var(--fg); border:1px solid var(--line);
          border-radius:7px; padding:9px 10px; font-size:14px; }
  input:focus-visible { outline:2px solid var(--acc); outline-offset:1px; border-color:var(--acc); }
  button { width:100%; margin-top:18px; background:#1f6feb; color:#fff; border:1px solid #1f6feb;
           border-radius:7px; padding:10px 12px; font-size:14px; cursor:pointer;
           transition:background .12s, transform .06s; }
  button:hover:not(:disabled) { background:#2b7bf3; }
  button:active:not(:disabled) { transform:translateY(1px) scale(.99); }
  button:disabled { opacity:.6; cursor:not-allowed; }
  button.busy { position:relative; color:transparent; }
  button.busy::after { content:""; position:absolute; inset:0; margin:auto; width:14px; height:14px;
       border:2px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%;
       animation:spin .7s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { button.busy::after { animation-duration:2s; } }
  #err { display:none; margin-top:14px; padding:9px 11px; border-radius:7px; font-size:13px;
         background:#3a1d1d; border:1px solid #6b2b2b; color:#ffd7d7; }
  #err.show { display:block; }
  footer { margin-top:16px; color:var(--mut); font-size:11px; text-align:center; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
</style>
</head>
<body>
<form class="box" id="form" autocomplete="on">
  <h1><span class="dot"></span> GPU Control</h1>
  <p class="sub">Acceso restringido al panel de la Tesla P100.</p>

  <label for="user">Usuario</label>
  <input id="user" name="user" type="text" autocapitalize="off" autocorrect="off" required autofocus
         value="admin">

  <label for="pass">Contraseña</label>
  <input id="pass" name="password" type="password" required>

  <button id="go" type="submit">Entrar</button>
  <div id="err" role="alert"></div>
  <footer class="mono">La sesión dura 7 días y se guarda en una cookie firmada.</footer>
</form>

<script>
const form = document.getElementById('form');
const go = document.getElementById('go');
const err = document.getElementById('err');

function fail(text) { err.textContent = text; err.className = 'show'; }

form.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  err.className = '';
  go.classList.add('busy');
  go.disabled = true;
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({user: document.getElementById('user').value, password: document.getElementById('pass').value}),
    });
    if (!r.ok) {
      let detail = '';
      try { detail = (await r.json()).detail; } catch (e) {}
      fail(detail || ('Error ' + r.status));
      document.getElementById('pass').select();
      return;
    }
    const next = new URLSearchParams(location.search).get('next');
    location.replace(next && next.startsWith('/') && !next.startsWith('//') ? next : '/');
  } catch (e) {
    fail('No se pudo contactar con el panel: ' + e.message);
  } finally {
    go.classList.remove('busy');
    go.disabled = false;
  }
});
</script>
</body>
</html>
