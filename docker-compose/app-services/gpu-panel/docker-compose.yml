services:
  gpu-panel:
    build: .
    image: gpu-panel:local
    container_name: gpu-panel
    restart: unless-stopped
    ports:
      - "8099:8099"
    environment:
      - TZ=${TZ:-Etc/UTC}
      - PANEL_USER=${PANEL_USER:-admin}
      - PANEL_PASSWORD=${PANEL_PASSWORD:?PANEL_PASSWORD is required}
      - PANEL_TOKEN=${PANEL_TOKEN:?PANEL_TOKEN is required}
      # Which models the dashboard may name, and where Jellyfin goes when the LLM
      # owns the P100. The values live in the rendered .env, never in this file.
      - LLAMA_PUBLIC_MODELS=${LLAMA_PUBLIC_MODELS:-}
      # Addresses come from the inventory (the container is not llama.cpp, so
      # its own localhost is not it); required, like the secrets.
      - LLAMA_URL=${LLAMA_URL:?LLAMA_URL is required}
      - PVE_HOST=${PVE_HOST:?PVE_HOST is required}
      - IMMICH_HOST=${IMMICH_HOST:?IMMICH_HOST is required}
      - FRONTEND_HOST=${FRONTEND_HOST:?FRONTEND_HOST is required}
      # Where the llama.cpp logs are read from: its systemd unit on the AI
      # container, entered by its Proxmox VM ID.
      - AI_CTID=${AI_CTID:?AI_CTID is required}
      - LLAMA_LOG_UNIT=${LLAMA_LOG_UNIT:-llama-server}
      - JELLYFIN_FALLBACK=${JELLYFIN_FALLBACK:-vaapi}
      # ComfyUI is the fourth consumer of the card and the only on-demand one:
      # its status is read over HTTP and it is started/stopped through the PVE
      # host, next to nvidia-smi. COMFY_URL is the LAN address because the panel
      # runs in its own container (127.0.0.1 would be itself).
      - COMFY_URL=${COMFY_URL:-}
      - COMFY_UI_URL=${COMFY_UI_URL:-}
      - COMFY_CONTAINER=${COMFY_CONTAINER:-comfyui}
    volumes:
      # The container's SSH key is what reaches the PVE host and the other GPU
      # consumers; mounted read-only so the panel can only use it, not change it.
      - /root/.ssh:/root/.ssh:ro
      # Auto-switch settings survive a container recreate.
      - gpu_panel_state:/state

volumes:
  gpu_panel_state:
