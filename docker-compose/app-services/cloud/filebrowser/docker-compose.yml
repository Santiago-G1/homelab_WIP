services:
  filebrowser:
    image: gtstef/filebrowser:2.0.8-beta@sha256:5a18725e2482cf23682758e59c8be3153364eb8ea8eb080f9dc17cd1c06a6bc0
    container_name: filebrowser
    environment:
      - FILEBROWSER_CONFIG=/home/filebrowser/data/config.yaml
      - FILEBROWSER_ADMIN_PASSWORD=${FILEBROWSER_ADMIN_PASSWORD:?FILEBROWSER_ADMIN_PASSWORD is required}
      - FILEBROWSER_ONLYOFFICE_SECRET=${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required}
    volumes:
      - $CLOUD_MOUNT:/folder
      - ./config:/home/filebrowser/data
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - onlyoffice

  onlyoffice:
    image: onlyoffice/documentserver:9.4.0.1@sha256:3ab6ebc7c605e5a32b7ae3ff19daed4925090245acc8100ce2230bd766c88212
    container_name: onlyoffice
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required}
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice

volumes:
  onlyoffice_data:
  onlyoffice_logs:
  onlyoffice_lib:
