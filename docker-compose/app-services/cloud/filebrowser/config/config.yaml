http:
  port: 80
  internalUrl: "http://filebrowser:80"

server:
  sources:
    - path: "/folder"
      name: "Nube"

auth:
  adminUsername: admin
  methods:
    password:
      enabled: true

# Secrets are NOT stored here: config.yaml does not expand $VARS.
# Set them via environment variables instead:
#   FILEBROWSER_ADMIN_PASSWORD      -> admin password
#   FILEBROWSER_ONLYOFFICE_SECRET   -> must match ONLYOFFICE_JWT_SECRET
integrations:
  office:
    url: "https://your.domain.com" #domain or ip
    internalUrl: "http://onlyoffice:80"
