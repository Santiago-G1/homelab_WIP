services:
  syncthing:
    image: syncthing/syncthing
    container_name: syncthing
    hostname: homelab
    environment:
      - PUID=${GLOBAL_PUID:-1000}
      - PGID=${GLOBAL_PGID:-1000}
    volumes:
      - ./config:/var/syncthing
      - $SYNC_MOUNT:/mnt/data
    network_mode: host
    restart: unless-stopped
