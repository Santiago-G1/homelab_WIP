services:
  samba:
    image: dockurr/samba:4.23.10@sha256:404f91bdf317d390241a41165579cd25199f34171b44677d877c75dc40184042
    container_name: samba
    environment:
      UID: "1000"
      GID: "1000"
      CLEAR: "Y"
    ports:
      - "445:445"
    volumes:
      - $CLOUD_MOUNT:/storage
      - $LLM_MOUNT:/llm_storage
      - ./smb.conf:/etc/samba/smb.conf
      - ./users.conf:/etc/samba/users.conf
    restart: always
