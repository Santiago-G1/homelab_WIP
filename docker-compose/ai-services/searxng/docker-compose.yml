# SearXNG: the agent's web search backend (JSON over the `ai-stack` network).
services:
  searxng:
    image: searxng/searxng:2026.10.19-81371861f@sha256:5ed0323b5f5f8701264ef65e239a2bd83cb57098f2b971fa30bf79c06eeae271
    container_name: searxng
    restart: unless-stopped

    environment:
      # The rendered settings.yml has no secret; this overrides server.secret_key.
      - SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET is required}
      # Only the HTML UI builds absolute links from it; the JSON API does not.
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://searxng:8080/}

    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml:ro
      # Compiled theme and locales: survives a restart.
      - ./data/cache:/var/cache/searxng

    ports:
      # 8080 belongs to llama.cpp; Caddy and Glance reach it on this port.
      - "${SEARXNG_PUBLISH_PORT:-8081}:8080"

    networks:
      - ai-stack

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  ai-stack:
    external: true
