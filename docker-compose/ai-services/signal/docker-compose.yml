# Link the number once: docker exec -it signal-cli signal-cli link -n hermes
# No published port: this HTTP API authenticates nobody.
services:
  signal-cli:
    build:
      context: .
      args:
        SIGNAL_CLI_VERSION: ${SIGNAL_CLI_VERSION:?SIGNAL_CLI_VERSION is required}
    image: signal-cli:local
    container_name: signal-cli
    restart: unless-stopped

    command: ["daemon", "--http", "0.0.0.0:8080", "--no-receive-stdout"]

    environment:
      - XDG_DATA_HOME=/var/lib/signal-cli
      - JAVA_TOOL_OPTIONS=-Xmx384m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError

    volumes:
      - ./data:/var/lib/signal-cli

    networks:
      - ai-stack

    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  ai-stack:
    external: true
