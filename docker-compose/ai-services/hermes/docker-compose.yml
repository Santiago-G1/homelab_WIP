# Hermes: one runtime, two profiles. `default` is the root home, `uncensored` is
# `profiles/uncensored`; both are served by this one gateway (see hermes_agents).
services:
  hermes:
    image: nousresearch/hermes-agent:v0.23.1@sha256:276d44685c65c0cb2a25f190b63c65c8906f9dc76486fb1c05ae71b5826bda08
    container_name: hermes
    restart: unless-stopped
    command: gateway run   # s6 supervises the gateway and the dashboard

    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # A non-loopback bind requires an auth provider; Caddy sits in front.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:?}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET:?}
      # Where the `obsidian` skill looks; the mounts decide what it may write.
      - OBSIDIAN_VAULT_PATH=${HERMES_VAULT:?}

    volumes:
      - ${HERMES_DATA:?}:${HERMES_HOME:?}
      # Ansible renders config.yaml, .env, SOUL.md and AGENTS.md into it: never
      # mount those files, Hermes replaces its config by rename (EBUSY).
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only, except `mori/`: a nested bind wins over the read-only parent.
      - ${HERMES_VAULT_RO:?}:${HERMES_VAULT:?}:ro
      - ${HERMES_VAULT_MORI:?}:${HERMES_VAULT:?}/mori

    ports:
      - "${PUBLISH_PORT:?}:9119"

    networks:
      - ai-stack

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G

networks:
  ai-stack:
    external: true
