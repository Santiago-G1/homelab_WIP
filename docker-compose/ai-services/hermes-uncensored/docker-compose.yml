# Hermes agent: the one with nothing in the way
# Approvals off and the Docker socket mounted, so it can do anything the
# container can. Deliberately not capped: that is the point of this agent.
services:
  hermes:
    image: nousresearch/hermes-agent:stable@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    container_name: hermes-uncensored
    restart: unless-stopped
    # s6 supervises the gateway (and the dashboard) inside the container.
    command: gateway run

    environment:
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_PORT=9119
      # A non-loopback bind requires an auth provider; Caddy sits in front.
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER:?}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASSWORD:?}
      - HERMES_DASHBOARD_BASIC_AUTH_SECRET=${HERMES_DASHBOARD_SECRET:?}

    volumes:
      # Sessions, memories, skills and the state database: on the pool.
      - ${HERMES_DATA:?}:/opt/data
      # Rendered by Ansible; the agent rewrites .env from the dashboard, so a
      # deploy overwrites it on purpose.
      - ./config.yaml:/opt/data/config.yaml
      - ./agent.env:/opt/data/.env
      # Only this agent gets the socket: everything Docker can reach is its reach.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${PUBLISH_PORT:?}:9119"

    networks:
      - ai-stack

    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 6G


networks:
  ai-stack:
    external: true
