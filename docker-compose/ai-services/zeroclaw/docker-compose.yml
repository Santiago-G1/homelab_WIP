# ZeroClaw agent runtime (see README.md for the sandbox model).
services:
  zeroclaw:
    image: zeroclaw:debian-docker
    build:
      context: ./image
    container_name: zeroclaw
    # Root on purpose: it rewrites its config on pairing and drives the sandbox
    # through the Docker socket.
    user: "0:0"
    restart: unless-stopped

    environment:
      # Secrets only, as ZEROCLAW_<a.b.c> overrides. The alias mirrors
      # `agent_alias` in models.yml.
      - ZEROCLAW_providers__models__litellm__coder__api_key=${ZEROCLAW_LITELLM_API_KEY:?ZEROCLAW_LITELLM_API_KEY is required}
      - ZEROCLAW_channels__telegram__home__bot_token=${ZEROCLAW_TELEGRAM_BOT_TOKEN:?ZEROCLAW_TELEGRAM_BOT_TOKEN is required}
      - ZEROCLAW_gateway__host=0.0.0.0
      - ZEROCLAW_gateway__allow_public_bind=true

      # Browser tool: Chromium from the image, and the flags a root user in a
      # container needs (see `shm_size` below).
      - AGENT_BROWSER_EXECUTABLE_PATH=/usr/bin/chromium
      - AGENT_BROWSER_ARGS=--no-sandbox,--disable-dev-shm-usage
      # The CLI leaves its daemon and the browser up for an hour otherwise.
      - AGENT_BROWSER_IDLE_TIMEOUT_MS=600000

    volumes:
      - ./data:/zeroclaw-data
      # Absolute path, and it must match the host: the daemon resolves the bind
      # mount, and config.toml names the same path. STACKS_ROOT is an env var for
      # exactly that reason.
      - ./workspace:${STACKS_ROOT:?STACKS_ROOT is required}/zeroclaw/workspace
      # The sandbox backend runs one `docker run` per command.
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "42617:42617"   # pairing required; Caddy is the intended entry point

    networks:
      - ai-stack

    # Chromium wants more than Docker's 64 MB /dev/shm, and 1 GB of RAM.
    shm_size: 512mb

    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

    # The upstream image ships no HEALTHCHECK.
    healthcheck:
      test: ["CMD", "zeroclaw", "status", "--format=exit-code"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s

  # Owns the sandbox image build only; the profile keeps it out of `up`.
  sandbox:
    image: zeroclaw-sandbox:1
    build:
      context: ./sandbox
    profiles: ["tools"]
    restart: "no"

networks:
  ai-stack:
    external: true
