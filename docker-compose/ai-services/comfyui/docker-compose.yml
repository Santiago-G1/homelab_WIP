# ComfyUI on the P100. It shares the card with llama.cpp, Immich ML and Jellyfin
# NVENC, so the GPU panel starts it as a fourth, on-demand "mode" instead of
# leaving it resident: llama.cpp alone holds ~15.8 of the 16 GB.
services:
  comfyui:
    build:
      context: .
      args:
        COMFYUI_VERSION: ${COMFYUI_VERSION:?set it in host_vars/llm/main.yml}
        GGUF_NODES_VERSION: ${COMFYUI_GGUF_VERSION:?set it in host_vars/llm/main.yml}
        IPADAPTER_NODES_VERSION: ${COMFYUI_IPADAPTER_VERSION:?set it in host_vars/llm/main.yml}
    image: comfyui:pascal
    container_name: comfyui
    # The panel decides when the card is free; after a reboot this stays down
    # until Image mode is selected.
    restart: "no"
    devices:
      - /dev/nvidia0
      - /dev/nvidiactl
      - /dev/nvidia-uvm
      - /dev/nvidia-uvm-tools
    volumes:
      # Models live on the tank, next to the llama.cpp GGUFs, in ComfyUI's own
      # layout (unet/, clip/, vae/, ...). Manager downloads land here too.
      - ${IMAGE_MODELS_PATH:?}:/opt/ComfyUI/models
      # Workflows, settings and reference images: the old ai-dock workspace.
      - ${WORKSPACE_PATH:?}/ComfyUI/user:/opt/ComfyUI/user
      - ${WORKSPACE_PATH:?}/ComfyUI/input:/opt/ComfyUI/input
      - ${OUTPUT_PATH:?}:/opt/ComfyUI/output
      # Persisted node installs (the entrypoint copies the baked ones here).
      - ./custom_nodes:/opt/ComfyUI/custom_nodes
      # An unprivileged LXC cannot run nvidia-container-cli (it needs
      # CAP_MKNOD), so the container gets the CT's driver libraries directly.
      # Everything else (cuBLAS, cuDNN, nvrtc) comes from the torch wheels.
      - /usr/lib/x86_64-linux-gnu/libcuda.so.1:/usr/lib/x86_64-linux-gnu/libcuda.so.1:ro
      - /usr/lib/x86_64-linux-gnu/libcuda.so:/usr/lib/x86_64-linux-gnu/libcuda.so:ro
      - /usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:/usr/lib/x86_64-linux-gnu/libnvidia-ptxjitcompiler.so.1:ro
    ports:
      # 8080 belongs to llama.cpp and 8081 to SearXNG on this host.
      - "${COMFYUI_PUBLISH_PORT:?}:8188"
    environment:
      TZ: ${TZ:-Etc/UTC}
      COMFYUI_ARGS: ${COMFYUI_ARGS:?}
      # Triton (a hard import of comfy_kitchen) resolves libcuda through
      # `ldconfig -p`, which cannot see a bind-mounted driver library.
      TRITON_LIBCUDA_PATH: /usr/lib/x86_64-linux-gnu
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8188/system_stats"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First start imports torch, comfy-kitchen and every node: tens of seconds.
      start_period: 90s
    networks:
      - ai-stack

networks:
  ai-stack:
    external: true
