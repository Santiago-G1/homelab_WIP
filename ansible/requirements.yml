---
# Collections the roles call. Install them with:
#   ansible-galaxy collection install -r requirements.yml
#
# ansible-core >= 2.19: `callback_result_format` (see ansible.cfg) is an option
# of the default callback from that version on.
collections:
  # synchronize, in roles/stacks.
  - name: ansible.posix
    version: ">=2.1.0"
