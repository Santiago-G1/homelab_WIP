# Collections the roles call. Install them with:
#   ansible-galaxy collection install -r requirements.yml
collections:
  # synchronize, in roles/stacks.
  - name: ansible.posix
    version: ">=2.1.0"
  # The `yaml` stdout callback ansible.cfg asks for lives here since ansible-core
  # dropped it from the builtin set.
  - name: community.general
    version: ">=11.2.1"
