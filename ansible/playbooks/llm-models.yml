---
# Model changes without recompiling llama.cpp: skips the build in roles/llamacpp
# and re-deploys only LiteLLM and the Hermes stack.
# Models: host_vars/llm/models.yml.
- name: Local model changes on the AI host (no rebuild)
  hosts: ai
  vars:
    llamacpp_skip_build: true
    stacks_only:
      - litellm
      - hermes
  roles:
    - llamacpp
    - stacks
