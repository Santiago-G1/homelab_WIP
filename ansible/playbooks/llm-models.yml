---
# Model changes without recompiling: gateway (per-key allow-list) and hermes only.
# Models: host_vars/llm/models.yml.
- name: Local model changes on the AI host (no rebuild)
  hosts: ai
  vars:
    llamacpp_skip_build: true
    stacks_only:
      - bifrost
      - hermes
  pre_tasks:
    - import_tasks: tasks/preflight.yml
    # Re-read: the inventory parsed this before llm-model-add could write it.
    - name: Read the models added by hand
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../inventories/host_vars/llm/models.local.yml"
      # Missing is fine: the file ships empty and llm_models defaults to [].
      failed_when: false
  roles:
    - llamacpp
    - stacks
