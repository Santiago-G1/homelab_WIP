---
# Base configuration for every container.
- name: Base configuration
  hosts: lxc
  roles:
    - common
    - node_exporter

# NVIDIA userspace driver where the P100 is used, before the stacks using it.
- name: GPU hosts (NVIDIA userspace driver)
  hosts: gpu
  roles:
    - nvidia

# Docker Engine plus every Compose project declared in host_vars/.
- name: Docker hosts
  hosts: docker_hosts
  roles:
    - docker
    - stacks

# The control node is monitored but never reconfigured by the base role.
- name: Monitoring agent on the control node
  hosts: management
  roles:
    - node_exporter

# The VPN container runs the daemon natively.
- name: Tailscale subnet router
  hosts: vpn
  roles:
    - tailscale

# llama.cpp in router mode, compiled on the container (LiteLLM comes from the
# docker_hosts play above): NVIDIA driver, then CUDA toolkit + llama.cpp + unit.
- name: AI host (llama.cpp bare metal)
  hosts: ai
  roles:
    - nvidia
    - llamacpp
