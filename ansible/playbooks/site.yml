---
# Base configuration for every container.
- name: Base configuration
  hosts: lxc
  roles:
    - common
    - node_exporter

# NVIDIA userspace driver where the Tesla P100 is used. Runs before the stacks
# that bind-mount its libraries.
- name: GPU hosts (NVIDIA userspace driver)
  hosts: gpu
  roles:
    - nvidia

# Docker Engine plus every Compose project declared in host_vars/.
- name: Docker hosts
  hosts: docker_hosts
  roles:
    - docker
    - stacks

# The GPU control panel runs on the control node: it is the only host with SSH
# reach to the PVE node and to every container that uses the GPU.
- name: GPU control panel
  hosts: management
  roles:
    - stacks

# The control node is monitored as well, but it is not re-configured by the
# base role (it is the machine running Ansible).
- name: Monitoring agent on the control node
  hosts: management
  roles:
    - node_exporter

# The VPN container runs the daemon natively, not as a Compose stack.
- name: Tailscale subnet router
  hosts: vpn
  roles:
    - tailscale

# llama.cpp in router mode, compiled on the container: no Docker for it, the
# LiteLLM stack next to it is deployed by the docker_hosts play above.
# NVIDIA userspace driver first, then CUDA toolkit + llama.cpp + systemd unit.
- name: AI host (llama.cpp bare metal)
  hosts: ai
  roles:
    - nvidia
    - llamacpp
