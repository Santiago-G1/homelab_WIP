---
# Serve a .gguf already in llamacpp_models_dir, in one command:
#   ansible-playbook playbooks/llm-model-add.yml -e model=Model-IQ4_XS.gguf [-e ctx=131072]
# Window from the file, capped at llm_max_ctx. Runs llm-models.yml afterwards.
- name: Register a model that is already on the AI host
  hosts: ai
  gather_facts: false

  vars:
    models_local_file: "{{ playbook_dir }}/../inventories/host_vars/llm/models.local.yml"
    gguf_meta: "{{ playbook_dir }}/../scripts/gguf-meta.py"
    model_file: "{{ model | basename }}"
    model_name: "{{ model_file | regex_replace('\\.gguf$', '') }}"
    model_path: "{{ llamacpp_models_dir }}/{{ model_file }}"

  pre_tasks:
    - import_tasks: tasks/preflight.yml
  tasks:
    - name: Refuse to run without a model
      ansible.builtin.assert:
        that: model is defined and model | length > 0
        fail_msg: "pass it as -e model=<file name in {{ llamacpp_models_dir }}>"
        quiet: true

    - name: Refuse a model that is already declared
      ansible.builtin.assert:
        that: model_name not in (llm_models | map(attribute='name') | list)
        fail_msg: >-
          {{ model_name }} is already declared (models.yml or models.local.yml).
          Change its args there — nothing else needs configuring.
        quiet: true

    - name: The .gguf has to be in the models directory already
      ansible.builtin.stat:
        path: "{{ model_path }}"
      register: model_stat

    - name: Say where the file goes
      ansible.builtin.assert:
        that: model_stat.stat.exists
        fail_msg: >-
          {{ model_path }} does not exist. Copy the file into
          {{ llamacpp_models_dir }} first (a subdirectory would be published as
          a model of its own, so keep it in the top level).
        quiet: true

    # Read-only: --check still needs the metadata for the tasks below.
    - name: Read what the file says about itself
      ansible.builtin.script:
        cmd: "{{ gguf_meta }} {{ model_path }}"
      register: model_info_raw
      changed_when: false
      check_mode: false

    - name: Keep the metadata
      ansible.builtin.set_fact:
        model_info: "{{ model_info_raw.stdout | from_json }}"

    - name: Decide the window
      ansible.builtin.set_fact:
        model_ctx: "{{ ctx | default([model_info.context_length | default(llm_max_ctx, true), llm_max_ctx] | min) | int }}"

    - name: Report what was found
      ansible.builtin.debug:
        msg:
          - "{{ model_info.name }} · {{ model_info.size_gib }} GiB · {{ model_info.architecture or 'unknown architecture' }}"
          - "own window: {{ model_info.context_length or 'not declared' }} → serving {{ model_ctx }}"
          - "chat template: {{ 'yes' if model_info.chat_template else 'no' }} · MTP head: {{ 'yes' if model_info.mtp_head else 'no' }}"
          - "vision: {{ 'yes' if model_info.vision else 'no' }} · tensors: {{ model_info.tensor_count }}"

    # First add turns `llm_models_local: []` into a real list header.
    # The repository is on the control node; this play targets the AI host.
    - name: Make room for entries
      ansible.builtin.lineinfile:
        path: "{{ models_local_file }}"
        regexp: '^llm_models_local:\s*(\[[^\]]*\])?\s*(#.*)?$'
        line: "llm_models_local:"
      delegate_to: localhost
      run_once: true
      when: not ansible_check_mode

    - name: Ask the file for its entry
      ansible.builtin.script:
        cmd: "{{ gguf_meta }} --yaml --ctx {{ model_ctx }} {{ model_path }}"
      register: model_entry
      changed_when: false
      check_mode: false

    - name: Write the entry
      ansible.builtin.blockinfile:
        path: "{{ models_local_file }}"
        insertafter: '^llm_models_local:'
        marker: "# {mark} {{ model_name }}"
        block: "{{ model_entry.stdout }}"
      delegate_to: localhost
      run_once: true
      when: not ansible_check_mode

    - name: Refuse to leave a list that no longer parses
      ansible.builtin.assert:
        that: >-
          (lookup('file', models_local_file) | from_yaml).llm_models_local
          | selectattr('name', 'equalto', model_name) | list | length == 1
        fail_msg: >-
          {{ models_local_file }} is not valid after the insert; restore it from
          git (the entry is in the message above) and add it by hand.
        quiet: true
      delegate_to: localhost
      run_once: true
      when: not ansible_check_mode

    - name: What changed
      ansible.builtin.debug:
        msg:
          - "{{ 'would write' if ansible_check_mode else 'wrote' }} {{ model_name }} (ctx {{ model_ctx }}) to {{ models_local_file }}"
          - "{{ 'nothing is touched: --check' if ansible_check_mode else 'rendering the preset, the gateway allow-list and hermes now' }}"

- import_playbook: llm-models.yml
