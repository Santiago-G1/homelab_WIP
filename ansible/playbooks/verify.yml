---
# End-to-end check: running containers, answering endpoints, no failed state.
- name: Verify the deployed stacks
  hosts: docker_hosts
  gather_facts: false
  tasks:
    - name: Docker daemon answers
      ansible.builtin.command: docker info --format '{{ "{{.ServerVersion}}" }}'
      changed_when: false

    # Empty lists up front: a collect task that never matches leaves them undefined.
    # service_ports mirrors what the compose files publish; the last play
    # compares both lists.
    - name: Read the ports every stack publishes
      ansible.builtin.command:
        cmd: docker compose config --format json
        chdir: "{{ stacks_root }}/{{ stack.name }}"
      loop: "{{ stacks | default([]) }}"
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"
      register: stack_configs
      changed_when: false

    - name: Collect the published host ports
      ansible.builtin.set_fact:
        published_ports: >-
          {{ (published_ports | default([]))
             + (stack_configs.results | map(attribute='stdout') | map('from_json')
                | map(attribute='services') | map('dict2items') | flatten
                | map(attribute='value') | selectattr('ports', 'defined')
                | map(attribute='ports') | flatten
                | selectattr('published', 'defined')
                | map(attribute='published') | map('int') | list) }}

    - name: Start the failure lists empty
      ansible.builtin.set_fact:
        stacks_down: []
        ondemand_missing: []
        routes_down: []

    - name: Every declared stack has running containers
      ansible.builtin.command:
        cmd: docker compose ps -q
        chdir: "{{ stacks_root }}/{{ stack.name }}"
      loop: >-
        {{ stacks | default([]) | rejectattr('name', 'in', stacks_on_demand | default([])) | list }}
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"
      register: stack_ps
      changed_when: false
      failed_when: false

    - name: Collect the stacks that are down
      ansible.builtin.set_fact:
        stacks_down: "{{ (stacks_down | default([])) + [item.stack.name] }}"
      loop: "{{ stack_ps.results }}"
      when: (item.stdout | default('') | trim) == ''

    - name: Every declared stack is up
      ansible.builtin.assert:
        that: stacks_down | default([]) | length == 0
        fail_msg: >-
          {{ stacks_down | default([]) | join(', ') }} is declared and not on demand, but has no
          running container. Look at `docker compose logs` in {{ stacks_root }}/<name>.
        success_msg: "{{ stack_ps.results | length }} stacks running."

    # On-demand stacks may be stopped, but their container must exist.
    - name: On-demand stacks have a container, running or not
      ansible.builtin.command:
        cmd: docker compose ps -a -q
        chdir: "{{ stacks_root }}/{{ stack.name }}"
      loop: >-
        {{ stacks | default([]) | selectattr('name', 'in', stacks_on_demand | default([])) | list }}
      loop_control:
        loop_var: stack
        label: "{{ stack.name }}"
      register: ondemand_ps
      changed_when: false
      failed_when: false

    - name: Collect the on-demand stacks with no container
      ansible.builtin.set_fact:
        ondemand_missing: "{{ (ondemand_missing | default([])) + [item.stack.name] }}"
      loop: "{{ ondemand_ps.results }}"
      when: (item.stdout | default('') | trim) == ''

    - name: Every on-demand stack has a container to start
      ansible.builtin.assert:
        that: ondemand_missing | default([]) | length == 0
        fail_msg: >-
          {{ ondemand_missing | default([]) | join(', ') }} has no container, so the panel cannot
          start it. `docker compose create` (what the role runs) builds the image first
          if it is missing.
        success_msg: "{{ ondemand_ps.results | length }} on-demand stacks created."

    # 0, 137 and 143 are deliberate stops (that is what the GPU panel sends);
    # anything else is a crash.
    - name: No container is left in a failed state
      ansible.builtin.shell: |
        docker ps -aq --filter status=exited --filter status=dead \
          | xargs -r docker inspect -f '{{ "{{.Name}} {{.State.ExitCode}}" }}' \
          | awk '$2 != 0 && $2 != 137 && $2 != 143' | wc -l
      register: failed_containers
      changed_when: false
      failed_when: failed_containers.stdout | int != 0

    # SNI needs a real hostname, so the proxy gets its own check.
    - name: Reverse proxy routes answer
      ansible.builtin.command:
        cmd: >-
          curl -s --resolve {{ item.host }}.{{ vault_domainname_hs }}:443:127.0.0.1 -o /dev/null
          -w '%{http_code}' https://{{ item.host }}.{{ vault_domainname_hs }}{{ item.path | default('/') }}
      loop: "{{ proxy_checks | default([]) }}"
      loop_control:
        label: "{{ item.host }}.{{ vault_domainname_hs }}"
      register: proxy_result
      changed_when: false
      failed_when: false

    - name: Collect the routes that did not answer
      ansible.builtin.set_fact:
        routes_down: >-
          {{ (routes_down | default([])) + [item.item.host ~ ' -> ' ~ (item.stdout | default('', true) | trim or 'no answer')] }}
      loop: "{{ proxy_result.results }}"
      when: >-
        item.rc != 0 or (item.stdout | default('', true) | trim) not in
        ['200', '301', '302', '303', '307', '308', '401', '403']

    - name: Every route answers
      ansible.builtin.assert:
        that: routes_down | default([]) | length == 0
        fail_msg: >-
          {{ routes_down | default([]) | join('; ') }}. 502 or no answer means the backend is not
          running: a stopped host leaves its route pointing at nothing.
        success_msg: "{{ proxy_result.results | length }} routes answered."

    - name: HTTP endpoints answer
      ansible.builtin.uri:
        url: "{{ item.url }}"
        status_code: [200, 301, 302, 303, 307, 308, 401, 403]
        follow_redirects: none
        headers: "{{ item.headers | default({}) }}"
        validate_certs: "{{ item.validate_certs | default(true) }}"
      loop: "{{ health_checks | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

# The hosts that use the P100.
- name: Verify the GPU hosts
  hosts: gpu
  gather_facts: false
  tasks:
    - name: GPU is visible
      ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      changed_when: false

# llama.cpp is a systemd unit, not a Compose stack.
- name: Verify the AI host
  hosts: ai
  gather_facts: false
  tasks:
    - name: llama-server service is active
      ansible.builtin.command: systemctl is-active {{ llamacpp_service }}
      changed_when: false

    - name: GPU is visible
      ansible.builtin.command: nvidia-smi --query-gpu=name,driver_version --format=csv,noheader
      changed_when: false

    - name: Router answers the model list
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ llamacpp_port }}/v1/models"
        status_code: 200

    # On demand: only checked while the panel has it up.
    - name: ComfyUI container state
      ansible.builtin.command: docker inspect -f '{{ "{{.State.Status}}" }}' comfyui
      register: comfy_state
      changed_when: false
      failed_when: false

    - name: ComfyUI answers its API while the panel has it up
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ service_ports.comfyui }}/system_stats"
        status_code: 200
      when: comfy_state.stdout | default('') == 'running'

# The port map and the compose files declare the same ports twice; this keeps
# them from drifting. It needs every container, so a stopped one has to be
# reported as stopped, not as a publish that went missing.
- name: The port map matches what Compose publishes
  hosts: devops
  gather_facts: false
  vars:
    # Syncthing publishes nothing: it runs with network_mode: host.
    host_network_ports: ["{{ service_ports.syncthing }}"]
    all_published_ports: >-
      {{ groups['docker_hosts'] | map('extract', hostvars, 'published_ports')
         | select('defined') | flatten | unique | sort }}
    undeclared_ports: >-
      {{ service_ports.values() | map('int') | sort
         | difference((all_published_ports | map('int') | list) + host_network_ports) }}
  tasks:
    # Without its ports a host's service_ports entries fall into
    # undeclared_ports, which then blames the port map for a stopped container.
    - name: Note the docker hosts that did not report their ports
      ansible.builtin.set_fact:
        ports_missing_hosts: "{{ (ports_missing_hosts | default([])) + [item] }}"
      loop: "{{ groups['docker_hosts'] }}"
      when: hostvars[item].published_ports is not defined

    - name: Every docker host reported its published ports
      ansible.builtin.assert:
        that: ports_missing_hosts | default([]) | length == 0
        fail_msg: >-
          {{ ports_missing_hosts | default([]) | join(', ') }} did not report:
          the container is stopped or unreachable, so the port map cannot be
          checked. Start it and re-run.
        success_msg: "All {{ groups['docker_hosts'] | length }} docker hosts reported."

    - name: Every service_ports entry is published by a stack
      ansible.builtin.assert:
        that: undeclared_ports | length == 0
        fail_msg: >-
          service_ports declares {{ undeclared_ports | join(', ') }} but no stack
          publishes {{ 'it' if undeclared_ports | length == 1 else 'them' }}:
          Caddy and Glance would point at a closed port.
        success_msg: "{{ service_ports | length }} ports declared, all published."
      when: ports_missing_hosts | default([]) | length == 0
