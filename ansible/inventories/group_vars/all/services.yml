---
# Service catalog: each entry becomes a Caddy route and a Glance card, so a
# service is declared once.
#
#   host, server, port, title, icon, group   identity and placement
#   path, ok       availability probe (path relative to the published name)
#   check: false   keep it out of the availability widget
#   verify: true   also probe it end to end in playbooks/verify.yml
#   release        GitHub repo for the "updates" widget
#   note           line rendered next to the route in the Caddyfile

ok_status_codes: [401, 403]   # several services answer 401/403 without a session

# Every LAN port Ansible needs, in one place. The compose files own the real
# published ports and this map has to match them (playbooks/verify.yml checks).
service_ports:
  blocky: 4000
  glance: 8080
  grafana: 3000
  prometheus: 9090
  jellyfin: 8096
  navidrome: 4533
  komga: 25600
  immich: 2283
  qbittorrent: 8080
  sonarr: 8989
  radarr: 7878
  prowlarr: 9696
  bazarr: 6767
  seerr: 5055
  calibre: 8082
  slskd: 5030
  vaultwarden: 8000
  radicale: 5232
  filebrowser: 80
  onlyoffice: 8080
  syncthing: 8384
  gpu_panel: 8099
  litellm: 4000
  searxng: 8081
  zeroclaw: 42617
  comfyui: 8188

homelab_services:
  # --- network -------------------------------------------------------------
  - host: blocky
    server: blocky
    port: "{{ service_ports.blocky }}"
    title: Blocky (DNS)
    icon: di:blocky
    group: Network
    path: /api/blocking/status
    note: Blocky has no web UI; this serves its API, DoH (/dns-query) and metrics.
    verify: true

  # --- monitoring ----------------------------------------------------------
  - host: home
    server: monitoring
    port: "{{ service_ports.glance }}"
    title: Dashboard
    icon: di:glance
    group: Monitoring
    path: /api/healthz
    note: Glance itself; /api/healthz answers without a session.
    verify: true

  - host: grafana
    server: monitoring
    port: "{{ service_ports.grafana }}"
    title: Grafana
    icon: di:grafana
    group: Monitoring
    path: /api/health
    release: grafana/grafana
    verify: true

  # --- media ---------------------------------------------------------------
  - host: movies
    server: frontend
    port: "{{ service_ports.jellyfin }}"
    title: Jellyfin
    icon: di:jellyfin
    group: Media
    path: /health
    release: jellyfin/jellyfin

  - host: music
    server: frontend
    port: "{{ service_ports.navidrome }}"
    title: Navidrome
    icon: di:navidrome
    group: Media
    path: /ping
    release: navidrome/navidrome
    verify: true

  - host: komga
    server: frontend
    port: "{{ service_ports.komga }}"
    title: Komga
    icon: di:komga
    group: Media
    release: gotson/komga

  - host: immich
    server: immich
    port: "{{ service_ports.immich }}"
    title: Immich
    icon: di:immich
    group: Media
    path: /api/server/ping
    release: immich-app/immich
    verify: true

  - host: torrent
    server: arrsuite
    port: "{{ service_ports.qbittorrent }}"
    title: qBittorrent
    icon: di:qbittorrent
    group: Media
    release: qbittorrent/qBittorrent
    verify: true

  - host: sonarr
    server: arrsuite
    port: "{{ service_ports.sonarr }}"
    title: Sonarr
    icon: di:sonarr
    group: Media
    release: Sonarr/Sonarr

  - host: radarr
    server: arrsuite
    port: "{{ service_ports.radarr }}"
    title: Radarr
    icon: di:radarr
    group: Media
    release: Radarr/Radarr

  - host: prowlarr
    server: arrsuite
    port: "{{ service_ports.prowlarr }}"
    title: Prowlarr
    icon: di:prowlarr
    group: Media
    release: Prowlarr/Prowlarr

  - host: bazarr
    server: arrsuite
    port: "{{ service_ports.bazarr }}"
    title: Bazarr
    icon: di:bazarr
    group: Media
    release: morpheus65535/bazarr

  - host: seerr
    server: arrsuite
    port: "{{ service_ports.seerr }}"
    title: Seerr
    icon: di:seerr
    group: Media
    release: seerr-team/seerr

  - host: calibre
    server: arrsuite
    port: "{{ service_ports.calibre }}"
    title: Calibre-Web
    icon: di:calibre-web
    group: Media
    release: janeczku/calibre-web

  - host: slskd
    server: arrsuite
    port: "{{ service_ports.slskd }}"
    title: slskd
    icon: di:slskd
    group: Media
    release: slskd/slskd

  # --- apps ----------------------------------------------------------------
  - host: password
    server: vaultwarden
    port: "{{ service_ports.vaultwarden }}"
    title: Vaultwarden
    icon: di:vaultwarden
    group: Apps
    path: /alive
    release: dani-garcia/vaultwarden
    verify: true

  - host: calendar
    server: radicale
    port: "{{ service_ports.radicale }}"
    title: Radicale
    icon: di:radicale
    group: Apps
    note: CalDAV/CardDAV; / redirects to the collection listing.

  - host: cloud
    server: cloud_service
    port: "{{ service_ports.filebrowser }}"
    title: Filebrowser
    icon: di:filebrowser
    group: Apps
    release: filebrowser/filebrowser

  - host: sync
    server: cloud_service
    port: "{{ service_ports.syncthing }}"
    title: Syncthing
    icon: di:syncthing
    group: Apps
    path: /rest/noauth/health
    release: syncthing/syncthing

  # --- ai ------------------------------------------------------------------
  - host: gpu
    server: llm
    port: "{{ service_ports.gpu_panel }}"
    title: GPU panel
    icon: sh:nvidia
    group: AI
    path: /api/session
    note: >-
      The GPU control panel, on the AI host next to llama.cpp; its dashboard
      widget reads the same API.
    verify: true

  - host: litellm
    server: llm
    port: "{{ service_ports.litellm }}"
    title: LiteLLM
    icon: sh:litellm
    group: AI
    path: /health/liveliness
    release: BerriAI/litellm
    verify: true

  - host: search
    server: llm
    port: "{{ service_ports.searxng }}"
    title: SearXNG
    icon: di:searxng
    group: AI
    path: /healthz
    release: searxng/searxng
    note: >-
      Web search for the agent; the limiter is off, so this is LAN-only and must
      not become a public hostname in the tunnel.
    verify: true

  # On demand: ComfyUI is an image-generation stack that needs the whole P100,
  # so the GPU panel starts it as its own mode and stops it again when the card
  # goes back to llama.cpp. That is why it is not in the availability widget or
  # in verify's route checks (a stopped but healthy service would look DOWN).
  - host: comfy
    server: llm
    port: "{{ service_ports.comfyui }}"
    title: ComfyUI
    icon: di:comfyui
    group: AI
    path: /system_stats
    release: comfyanonymous/ComfyUI
    check: false
    note: >-
      ComfyUI (SDXL on the P100). Shares the card with llama.cpp: Image mode
      frees the GPU and starts it, and the panel stops it again when llama.cpp
      is used or after its idle timer. No auth, so LAN-only.

  - host: agent
    server: llm
    port: "{{ service_ports.zeroclaw }}"
    title: ZeroClaw
    icon: mdi:robot
    group: AI
    note: ZeroClaw gateway; pairing (not the proxy) is what authenticates it.
    verify: true
