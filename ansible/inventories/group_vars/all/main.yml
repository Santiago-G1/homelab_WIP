---
# Shared settings for every managed host.
timezone: America/Bogota
lan_cidr: 192.168.10.0/24    # advertised by the Tailscale subnet router
homelab_repo: Santiago-G1/homelab_WIP

# Merged under each stack's own env; containers read them from the .env.
stack_env_common:
  DOMAINNAME_HS: "{{ vault_domainname_hs }}"
  TZ: "{{ timezone }}"

stacks_root: /opt/docker
compose_src_root: "{{ playbook_dir }}/../../docker-compose"

# The control node injects its own key so every container stays reachable.
admin_authorized_keys:
  - "{{ lookup('file', '/root/.ssh/id_ed25519.pub') }}"

common_packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - unzip
  - rsync
  - vim
  - tree
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_daemon_options:
  log-driver: json-file    # cap the logs so they cannot fill the thin LVM pool
  log-opts:
    max-size: 10m
    max-file: "3"

# Scrape targets, keyed by inventory name so every series carries its hostname.
node_exporter_hosts: >-
  {{ dict((groups['lxc'] + groups['management'])
     | zip((groups['lxc'] + groups['management'])
     | map('extract', hostvars, 'ansible_host'))) }}
