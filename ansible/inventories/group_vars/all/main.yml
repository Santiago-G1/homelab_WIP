---
# Shared settings for every managed host.

timezone: America/Bogota

# The lab's LAN, in CIDR form: the Tailscale subnet router advertises it.
lan_cidr: 192.168.10.0/24

# Repo of this lab, for the dashboard's "!lab" shortcut (Glance).
homelab_repo: Santiago-G1/homelab_WIP

# Environment every stack gets, merged under its own `env` entry by
# roles/stacks. Keeps the zone and the timezone out of every host_vars file and
# out of each compose file: containers read them from the rendered .env.
stack_env_common:
  DOMAINNAME_HS: "{{ vault_domainname_hs }}"
  TZ: "{{ timezone }}"

# Where each Docker Compose project is deployed on the target host.
stacks_root: /opt/docker
compose_src_root: "{{ playbook_dir }}/../../docker-compose"

# The control node injects its own key so every container stays reachable.
admin_authorized_keys:
  - "{{ lookup('file', '/root/.ssh/id_ed25519.pub') }}"

common_packages:
  - ca-certificates
  - curl
  - gnupg
  - jq
  - unzip
  - rsync
  - vim
  - tree
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_daemon_options:
  # Keep container logs from filling the thin LVM pool.
  log-driver: json-file
  log-opts:
    max-size: 10m
    max-file: "3"

# Every container runs node_exporter; Prometheus scrapes them on port 9100.
node_exporter_targets: >-
  {{ (groups['lxc'] + groups['management'])
     | map('extract', hostvars, 'ansible_host')
     | map('regex_replace', '$', ':9100')
     | list }}

# The same hosts keyed by inventory name. A scrape target built from this one
# carries its hostname as a label, so every panel can say `immich` instead of
# `192.168.10.22` without translating anything downstream.
node_exporter_hosts: >-
  {{ dict((groups['lxc'] + groups['management'])
     | zip((groups['lxc'] + groups['management'])
     | map('extract', hostvars, 'ansible_host'))) }}
