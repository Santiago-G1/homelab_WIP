# Inventory of the Terraform-managed containers. The control node is devops.

# The hypervisor, reached as itself.
[proxmox_host]
pve             ansible_host=192.168.10.2

[management]
devops          ansible_host=192.168.10.11   ansible_connection=local
# Monitoring only: the base, docker and stacks roles skip it.
pve

[dns]
blocky          ansible_host=192.168.10.3

[proxy]
caddy           ansible_host=192.168.10.4

[vpn]
tailscale       ansible_host=192.168.10.5

[tunnel]
cf_tunnel       ansible_host=192.168.10.6

[observability]
monitoring      ansible_host=192.168.10.10

[media]
arrsuite        ansible_host=192.168.10.20
frontend        ansible_host=192.168.10.21
immich          ansible_host=192.168.10.22

# Hosts with a Tesla P100: roles/nvidia installs the userspace driver here.
[gpu]
frontend
immich
llm

[apps]
vaultwarden     ansible_host=192.168.10.23
radicale        ansible_host=192.168.10.24
cloud_service   ansible_host=192.168.10.25


# llama.cpp runs bare metal (roles/llamacpp); the GPU panel is a Compose stack.
[ai]
llm             ansible_host=192.168.10.26

[lxc:children]
dns
proxy
vpn
tunnel
observability
media
apps
ai

# Hosts that run Docker Compose stacks.
[docker_hosts:children]
dns
proxy
tunnel
observability
media
apps
ai
