# Hostnames match the Terraform-managed containers (terraform/proxmox/).
# The control node is devops itself, so plays run locally from there.

[proxmox_host]
pve             ansible_host=192.168.10.2    ansible_connection=local

[management]
devops          ansible_host=192.168.10.11   ansible_connection=local

[dns]
blocky          ansible_host=192.168.10.3

[proxy]
caddy           ansible_host=192.168.10.4

[vpn]
tailscale       ansible_host=192.168.10.5

[tunnel]
cf_tunnel       ansible_host=192.168.10.6

[observability]
monitoring      ansible_host=192.168.10.10

[media]
arrsuite        ansible_host=192.168.10.20
frontend        ansible_host=192.168.10.21
immich          ansible_host=192.168.10.22

# Containers that use the Tesla P100, so roles/nvidia installs its userspace
# driver there. The device nodes come from terraform/proxmox/lxc_media.tf.
[gpu]
frontend
immich

[apps]
vaultwarden     ansible_host=192.168.10.23
radicale        ansible_host=192.168.10.24
cloud_service   ansible_host=192.168.10.25


# llama.cpp runs bare metal here (no Docker): roles nvidia + llamacpp. The GPU
# control panel is the one Compose stack on this host, next to the card it reads.
[ai]
llm             ansible_host=192.168.10.26

[lxc:children]
dns
proxy
vpn
tunnel
observability
media
apps
ai

# Containers that run Docker Compose stacks. The AI host runs llama.cpp bare
# metal, but the LiteLLM stack next to it is a Compose project.
[docker_hosts:children]
dns
proxy
tunnel
observability
media
apps
ai
