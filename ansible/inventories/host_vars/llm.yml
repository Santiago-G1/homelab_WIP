---
# Tesla P100 (Pascal GP100, compute 6.0). llama.cpp is built and runs bare metal
# here (roles/nvidia + roles/llamacpp), in router mode: it loads whichever .gguf
# in llamacpp_models_dir the request names. The LiteLLM proxy next to it is a
# Compose stack (roles/stacks), so this host is a docker_host as well.

# Must be IDENTICAL to the driver on the Proxmox host
# (nvidia-smi --query-gpu=driver_version --format=csv,noheader there).
# R580 is the last branch that supports Pascal.
nvidia_driver_version: "580.159.04"

# CUDA 12.x is the newest line that can target Pascal (13.x dropped compute
# capability 6.x), and 12.8 is the version this rig's max-perf build was
# validated with. Every 12.x release needs the crt/math_functions.h patch that
# roles/llamacpp applies, because its sinpi/cospi declarations clash with
# glibc 2.41's. The repositories are split per Debian release and debian13 only
# ships the 13.x toolkit, so the Debian 12 repo is used even though the
# container runs trixie.
cuda_toolkit_package: cuda-toolkit-12-8
cuda_repo_distro: debian12
llamacpp_cuda_root: /usr/local/cuda-12.8
llamacpp_cuda_arch: "60-real"    # Tesla P100

llamacpp_version: master         # pin a tag (bXXXX) for reproducible builds
llamacpp_port: 8080
llamacpp_build_jobs: 4

llamacpp_models_dir: /mnt/data/models   # /tank/cloud/llm on the host
llamacpp_models_max: 1                  # one model at a time (P100 VRAM)
llamacpp_preset_file: /etc/llama/models.ini

llamacpp_global_args:
  n-gpu-layers: 99
  c: 8192
  flash-attn: "on"

# Per-model overrides; the key is the model name the router lists.
llamacpp_model_overrides: {}

# sm_60 has no dp4a: the runtime heuristic already picks MMQ for MoE (faster
# without dp4a) and cuBLAS for dense models. Forcing MMQ here would slow the
# dense ones down.
llamacpp_cuda_force_mmq: "OFF"

# LiteLLM publishes the OpenAI API on :4000 (with a Postgres usage database) and
# proxies the router above, so clients get one endpoint with API keys and
# accounting. The router itself needs no credentials: this dummy key is only
# what the OpenAI client library insists on.
litellm_api_base: "http://{{ ansible_host }}:{{ llamacpp_port }}/v1"
litellm_backend_api_key: "sk-llamacpp"

# Listed in LiteLLM's /v1/models; anything else still works through the
# wildcard entry the template renders (see roles/stacks/templates).
litellm_models:
  - Qwen3.5-9B-UD-Q4_K_XL
  - Qwen3.6-35B-A3B-UD-IQ3_S
  - Qwen3.8-27B-UD-IQ4_XS
  - Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp

docker_networks:
  - ai-stack

stacks:
  - name: litellm
    src: ai-services/litellm
    files:
      - { template: litellm-config.yaml.j2, dest: config.yaml }
    env:
      LITELLM_DB_PASSWORD: "{{ vault_litellm_db_password }}"
      LITELLM_MASTER_KEY: "{{ vault_litellm_master_key }}"
      LITELLM_SALT_KEY: "{{ vault_litellm_salt_key }}"

health_checks:
  - { name: litellm, url: "http://127.0.0.1:4000/health/liveliness" }
