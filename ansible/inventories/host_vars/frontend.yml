---
# /tank/media is bind-mounted read-only at /mnt/media on this container.
frontend_env:
stacks:
  - { name: jellyfin,  src: media-services/frontend/jellyfin}
  - { name: komga,     src: media-services/frontend/komga}
  - name: navidrome
    src: media-services/frontend/navidrome
    # The official image does not chown its data dir, so create it as the
    # matching container uid (see the ACLs on /tank/media/music).
    dirs:
      - { path: config, owner: "1010", group: "1010" }

health_checks:
  - { name: jellyfin, url: "http://127.0.0.1:8096/health" }
  - { name: komga, url: "http://127.0.0.1:25600/" }
  - { name: navidrome, url: "http://127.0.0.1:4533/" }
