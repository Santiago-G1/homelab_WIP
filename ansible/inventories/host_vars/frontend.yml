---
# Media is bind-mounted read-only here; the stacks get its path as DATA_MOUNT.
stack_env_host:
  DATA_MOUNT: /mnt/media

stacks:
  - { name: jellyfin,  src: media-services/frontend/jellyfin }
  - { name: komga,     src: media-services/frontend/komga }
  - name: navidrome
    src: media-services/frontend/navidrome
    # The image does not chown its data dir: create it as the container uid.
    dirs:
      - { path: config, owner: "1010", group: "1010" }

health_checks:
  - { name: jellyfin,  url: "http://127.0.0.1:{{ service_ports.jellyfin }}/health" }
  - { name: komga,     url: "http://127.0.0.1:{{ service_ports.komga }}/" }
  - { name: navidrome, url: "http://127.0.0.1:{{ service_ports.navidrome }}/" }
