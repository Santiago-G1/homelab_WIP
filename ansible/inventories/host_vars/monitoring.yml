---
# Shared by the prometheus and grafana stacks: the datasource addresses
# `prometheus:9090`, which only resolves inside a common network.
docker_networks:
  - homelab_monitoring

prometheus_jobs:
  - { job: prometheus,    targets: ["localhost:9090"] }
  - { job: node_exporter, hosts: "{{ node_exporter_hosts }}", port: 9100 }
  - { job: blocky,        targets: ["{{ hostvars['blocky'].ansible_host }}:{{ service_ports.blocky }}"] }
  - { job: alertmanager,  targets: ["alertmanager:9093"] }
  # No `llama` job: in router mode its metrics live on the loaded model's port,
  # so :8080/metrics answers 400 while the server is healthy.

glance_admin_user: admin

stacks:
  - name: prometheus
    src: monitoring-services/prometheus
    files:
      - { template: prometheus.yml.j2, dest: prometheus.yml }
      # Carries the bot token, and the image runs as nobody, so 0600 root is a
      # permission denied: the file has to belong to 65534.
      - { template: alertmanager.yml.j2, dest: alertmanager.yml, mode: "0600", owner: "65534", group: "65534" }
    dirs:
      # Both images run as nobody and need writable dirs.
      - { path: data, owner: "65534", group: "65534" }
      - { path: alertmanager, owner: "65534", group: "65534" }

  - name: grafana
    src: monitoring-services/grafana
    files:
      - { template: grafana-datasource.yml.j2, dest: provisioning/datasources/prometheus.yml }
    dirs:
      - { path: config, owner: "472", group: "472" }   # uid 472; it does not chown
    env:
      GF_DATABASE_NAME: "{{ vault_gf_database_name }}"
      GF_DATABASE_USER: "{{ vault_gf_database_user }}"
      GF_DATABASE_PASSWORD: "{{ vault_gf_database_password }}"
    postgres:
      service: grafana_postgres
      container: grafana_postgres
      user_env: GF_DATABASE_USER
      password_env: GF_DATABASE_PASSWORD
      database_env: GF_DATABASE_NAME

  - name: glance
    src: monitoring-services/glance
    files:
      - { template: glance.yml.j2, dest: config/glance.yml }
    dirs:
      - { path: config }
    env:
      TZ: "{{ timezone }}"
      GLANCE_SECRET_KEY: "{{ vault_glance_secret_key }}"
      GLANCE_ADMIN_PASSWORD: "{{ vault_glance_admin_password }}"
      GPU_PANEL_TOKEN: "{{ vault_gpu_panel_token }}"

health_checks:
  - { name: prometheus, url: "http://127.0.0.1:{{ service_ports.prometheus }}/-/healthy" }
  - { name: grafana,    url: "http://127.0.0.1:{{ service_ports.grafana }}/api/health" }
  - { name: glance,     url: "http://127.0.0.1:{{ service_ports.glance }}/api/healthz" }
