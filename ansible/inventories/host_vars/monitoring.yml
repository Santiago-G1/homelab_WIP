---
prometheus_jobs:
  - { job: prometheus,    targets: ["localhost:9090"] }
  - { job: node_exporter, targets: "{{ node_exporter_targets }}" }
  # Addresses come from the inventory, like the exporter targets above.
  - { job: blocky,        targets: ["{{ hostvars['blocky'].ansible_host }}:{{ service_ports.blocky }}"] }
  - { job: llama,         targets: ["{{ hostvars['llm'].ansible_host }}:{{ hostvars['llm'].llamacpp_port }}"] }  # llama-server --metrics

# The dashboard's own login; the password and the session key live in the vault.
glance_admin_user: admin

stacks:
  - name: prometheus
    src: monitoring-services/prometheus
    files:
      - { template: prometheus.yml.j2, dest: prometheus.yml }
    dirs:
      # The prometheus image runs as nobody and needs a writable TSDB dir.
      - { path: data, owner: "65534", group: "65534" }

  - name: grafana
    src: monitoring-services/grafana
    files:
      - { template: grafana-datasource.yml.j2, dest: provisioning/datasources/prometheus.yml }
    dirs:
      # The grafana image runs as uid 472 and does not chown its data dir.
      - { path: config, owner: "472", group: "472" }
    env:
      GF_DATABASE_NAME: "{{ vault_gf_database_name }}"
      GF_DATABASE_USER: "{{ vault_gf_database_user }}"
      GF_DATABASE_PASSWORD: "{{ vault_gf_database_password }}"

  # Glance reads the same catalog as Caddy, so the route table, the
  # availability list, the bookmarks and the release tracker cannot drift.
  - name: glance
    src: monitoring-services/glance
    files:
      - { template: glance.yml.j2, dest: config/glance.yml }
    dirs:
      - { path: config }
    env:
      TZ: "{{ timezone }}"
      GLANCE_SECRET_KEY: "{{ vault_glance_secret_key }}"
      GLANCE_ADMIN_PASSWORD: "{{ vault_glance_admin_password }}"
      # Already in the vault for the panel's own stack; reused read-only here.
      GPU_PANEL_TOKEN: "{{ vault_gpu_panel_token }}"

health_checks:
  - { name: prometheus, url: "http://127.0.0.1:{{ service_ports.prometheus }}/-/healthy" }
  - { name: grafana,    url: "http://127.0.0.1:{{ service_ports.grafana }}/api/health" }
  - { name: glance,     url: "http://127.0.0.1:{{ service_ports.glance }}/api/healthz" }
