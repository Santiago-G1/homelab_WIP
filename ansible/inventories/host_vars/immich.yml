---
# /tank/immich is owned by these; the override runs the server as them.
immich_uid: 999
immich_gid: 991

stacks:
  - name: immich
    src: media-services/immich
    files:
      - { template: immich-override.yml.j2, dest: docker-compose.override.yml }
    env:
      IMMICH_VERSION: "{{ vault_immich_version }}"
      UPLOAD_LOCATION: "{{ vault_immich_upload_location }}"
      DB_DATA_LOCATION: "{{ vault_immich_db_data_location }}"
      DB_USERNAME: "{{ vault_immich_db_username }}"
      DB_PASSWORD: "{{ vault_immich_db_password }}"
      DB_DATABASE_NAME: "{{ vault_immich_db_database_name }}"
    # ./database was initialised with these names. The role reconciles the
    # cluster before the app starts, so a vault rotation does not break login.
    postgres:
      service: database
      container: immich_postgres
      user_env: DB_USERNAME
      password_env: DB_PASSWORD
      database_env: DB_DATABASE_NAME

health_checks:
  - { name: immich-server, url: "http://127.0.0.1:{{ service_ports.immich }}/api/server/ping" }
