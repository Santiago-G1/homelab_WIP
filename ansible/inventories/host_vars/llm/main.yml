---
# P100 (sm_60). llama.cpp runs bare metal in router mode; LiteLLM, SearXNG,
# ZeroClaw and ComfyUI are Compose stacks on the same host.
#
# The CUDA/llama.cpp build defaults live in roles/llamacpp/defaults, and the
# driver version in group_vars/gpu (this host is in [gpu]): only what differs
# from those belongs here.
#
# The port is here and not only in the role default because the stacks below
# read it too: llama.cpp, LiteLLM's api_base and the GPU panel have to agree.
llamacpp_port: 8080

litellm_api_base: "http://{{ ansible_host }}:{{ llamacpp_port }}/v1"
litellm_backend_api_key: "{{ vault_litellm_backend_api_key }}"

docker_networks:
  - ai-stack

zeroclaw_litellm_uri: http://litellm-proxy:4000/v1
# The agent model's window comes from models.yml, so switching models there
# moves these two with it; the reply budget is the remaining quarter.
# The models ZeroClaw serves are the ones that must not sit minutes in silence.
# The pool reads a 21 GiB GGUF at ~60 MB/s (5m40s before the first token); this
# container's root disk is on the SSD (~255 MB/s, 3m25s measured). One model
# fits: the thin pool is at ~86 % afterwards. Add a name here when there is room
# (see docs/llm-models.md, "Where the file lives").
llamacpp_fast_models_dir: /var/lib/llama/models
llamacpp_fast_models:
  - Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL
  - Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL

zeroclaw_context_window: >-
  {{ (llm_models | selectattr('agent', 'defined') | first).args | default({})
     | dict2items | selectattr('key', 'equalto', 'ctx-size')
     | map(attribute='value') | first | default(262144) }}
zeroclaw_max_context_tokens: "{{ (zeroclaw_context_window | int * 3 // 4) }}"
# A 21 GiB model takes minutes to load from the pool before it answers.
zeroclaw_message_timeout_secs: 900     # per channel message (LLM + tools)
zeroclaw_provider_timeout_secs: 900    # per HTTP request to LiteLLM
# Local models cost nothing per call, so the stock ceilings (12 iterations, 20
# actions/hour, 8k reply) only cut real work short. A tool result is capped at
# 8k chars on purpose: every result stays in the history and is re-prefilled at
# ~550 t/s on the P100, so 40k-char pages were what made a turn sit 27 s before
# the first token (long enough for the dashboard to cancel it).
zeroclaw_max_tool_iterations: 40
zeroclaw_max_actions_per_hour: 1000
zeroclaw_max_tool_result_chars: 8000
zeroclaw_max_tokens: 16384
# Named by config.toml and built by the stack.
zeroclaw_sandbox_image: zeroclaw-sandbox:1

searxng_host: searxng
searxng_port: 8080                      # llama.cpp owns 8080 on the LAN
searxng_publish_port: "{{ service_ports.searxng }}"
searxng_instance_name: "Homelab search"
searxng_base_url: "https://search.{{ vault_domainname_hs }}/"
zeroclaw_searxng_instance_url: "http://{{ searxng_host }}:{{ searxng_port }}"
zeroclaw_telegram_user_id: "{{ vault_zeroclaw_telegram_user_id }}"

# On demand: ComfyUI needs the whole card, so the GPU panel starts it in Image mode.
comfyui_version: v0.42.5
comfyui_gguf_nodes_version: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
comfyui_ipadapter_nodes_version: a0f451a5113cf9becb0847b92884cb10cbdec0ef
comfyui_publish_port: "{{ service_ports.comfyui }}"
comfyui_models_path: /mnt/data/image_models
comfyui_workspace: /mnt/data/comfyui_workspace
comfyui_output_path: /mnt/data/comfyui_output
# fp16 forced and SDPA only: torch on Pascal has no faster path (see docs/comfyui.md).
comfyui_args: >-
  --force-fp16 --use-pytorch-cross-attention --disable-smart-memory
  --reserve-vram 0.75 --preview-method none --disable-auto-launch

stacks_on_demand:
  - comfyui

stacks:
  - name: litellm
    src: ai-services/litellm
    files:
      - { template: litellm-config.yaml.j2, dest: config.yaml }
    env:
      LITELLM_DB_PASSWORD: "{{ vault_litellm_db_password }}"
      # Explicit so the reconcile can read them from the rendered .env.
      LITELLM_DB_USER: litellm
      LITELLM_DB_NAME: litellm
      LITELLM_MASTER_KEY: "{{ vault_litellm_master_key }}"
      LITELLM_SALT_KEY: "{{ vault_litellm_salt_key }}"
    postgres:
      service: litellm-db
      container: litellm-db
      user_env: LITELLM_DB_USER
      password_env: LITELLM_DB_PASSWORD
      database_env: LITELLM_DB_NAME
    agent_keys:
      - value: "{{ vault_zeroclaw_litellm_api_key }}"
        models: "{{ zeroclaw_models }}"

  - name: searxng
    src: ai-services/searxng
    dirs:
      - { path: config }
      - { path: data/cache, owner: "977", group: "977" }
    files:
      - { template: searxng-settings.yml.j2, dest: config/settings.yml }
    env:
      SEARXNG_SECRET: "{{ vault_searxng_secret_key }}"
      SEARXNG_BASE_URL: "{{ searxng_base_url }}"
      SEARXNG_PUBLISH_PORT: "{{ searxng_publish_port }}"

  - name: comfyui
    src: ai-services/comfyui
    build: true
    dirs:
      - { path: custom_nodes }
    env:
      COMFYUI_VERSION: "{{ comfyui_version }}"
      COMFYUI_GGUF_VERSION: "{{ comfyui_gguf_nodes_version }}"
      COMFYUI_IPADAPTER_VERSION: "{{ comfyui_ipadapter_nodes_version }}"
      COMFYUI_PUBLISH_PORT: "{{ comfyui_publish_port }}"
      COMFYUI_ARGS: "{{ comfyui_args }}"
      IMAGE_MODELS_PATH: "{{ comfyui_models_path }}"
      WORKSPACE_PATH: "{{ comfyui_workspace }}"
      OUTPUT_PATH: "{{ comfyui_output_path }}"

  - name: zeroclaw
    src: ai-services/zeroclaw
    build_services: [zeroclaw, sandbox]
    dirs:
      - { path: data/.zeroclaw }
      - { path: workspace }
    files:
      - { template: zeroclaw-config.toml.j2, dest: data/.zeroclaw/config.toml }
    env:
      ZEROCLAW_LITELLM_API_KEY: "{{ vault_zeroclaw_litellm_api_key }}"
      ZEROCLAW_TELEGRAM_BOT_TOKEN: "{{ vault_zeroclaw_telegram_bot_token }}"
      # Interpolation only, and no ZEROCLAW_ prefix: that prefix is the daemon's
      # own config-override namespace.
      ZC_PORT: "{{ service_ports.zeroclaw }}"
      ZC_SANDBOX_IMAGE: "{{ zeroclaw_sandbox_image }}"

  - name: gpu-panel
    src: app-services/gpu-panel
    build: true
    env:
      PANEL_USER: admin
      PANEL_PASSWORD: "{{ vault_gpu_panel_password }}"
      PANEL_TOKEN: "{{ vault_gpu_panel_token }}"
      LLAMA_URL: "http://{{ ansible_host }}:{{ llamacpp_port }}"
      # The card is driven over SSH to the PVE: an unprivileged container cannot
      # set the power limit, and the same key reaches Immich and Jellyfin.
      PVE_HOST: "root@{{ hostvars['pve'].ansible_host }}"
      IMMICH_HOST: "root@{{ hostvars['immich'].ansible_host }}"
      FRONTEND_HOST: "root@{{ hostvars['frontend'].ansible_host }}"
      # Jellyfin's config on that host, read over the same SSH: the path follows
      # stacks_root so the panel has no /opt/docker of its own.
      JELLYFIN_XML: "{{ stacks_root }}/jellyfin/config/encoding.xml"
      AI_CTID: "126"   # this container, for llama-server's journald logs
      # Over the LAN: inside the panel container 127.0.0.1 is the panel itself.
      COMFY_URL: "http://{{ ansible_host }}:{{ service_ports.comfyui }}"
      COMFY_UI_URL: "https://comfy.{{ vault_domainname_hs }}/"
      COMFY_CONTAINER: comfyui
      # Only these ids are ever printed; anything else the router serves stays unnamed.
      LLAMA_PUBLIC_MODELS: "{{ llm_models | map(attribute='name') | join(',') }}"

health_checks:
  - { name: litellm,   url: "http://127.0.0.1:{{ service_ports.litellm }}/health/liveliness" }
  - { name: searxng,   url: "http://127.0.0.1:{{ service_ports.searxng }}/healthz" }
  - { name: gpu-panel, url: "http://127.0.0.1:{{ service_ports.gpu_panel }}/api/session" }
