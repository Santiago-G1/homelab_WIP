---
# P100 (sm_60). llama.cpp runs bare metal in router mode; LiteLLM, SearXNG,
# Hermes and ComfyUI are Compose stacks on the same host.
#
# The CUDA/llama.cpp build defaults live in roles/llamacpp/defaults, and the
# driver version in group_vars/gpu (this host is in [gpu]): only what differs
# from those belongs here.
#
# The port is here and not only in the role default because the stacks below
# read it too: llama.cpp, LiteLLM's api_base and the GPU panel have to agree.
llamacpp_port: 8080

litellm_api_base: "http://{{ ansible_host }}:{{ llamacpp_port }}/v1"
litellm_backend_api_key: "{{ vault_litellm_backend_api_key }}"

docker_networks:
  - ai-stack

searxng_host: searxng
searxng_port: 8080                      # llama.cpp owns 8080 on the LAN
searxng_instance_name: "Homelab search"
searxng_base_url: "https://search.{{ vault_domainname_hs }}/"

# The agent model's window comes from models.yml, and the models that must not
# sit minutes in silence are the ones marked `fast: true` there: the pool reads a
# 21 GiB GGUF at ~60 MB/s (5m40s) while this host's SSD does ~255 MB/s (3m25s).
llamacpp_fast_models_dir: /var/lib/llama/models
llamacpp_fast_models: "{{ llm_models | selectattr('fast', 'defined') | map(attribute='name') | list }}"

# --- Hermes agents -------------------------------------------------------
# Each one is its own stack and its own container: that is the sandbox. Their
# state (memories, sessions, state.db, skills) lives on the pool.
hermes_litellm_uri: "http://litellm-proxy:{{ service_ports.litellm }}/v1"
# Container port, not the published one: both stacks share `ai-stack`.
hermes_searxng_uri: "http://{{ searxng_host }}:{{ searxng_port }}"
hermes_data_root: /mnt/data/hermes   # one home; the profiles live inside

hermes_agents:
  # The cautious one: it asks, and a headless run finds another way.
  default:
    approvals_mode: "smart"
    unattended_mode: "deny"
    terminal_backend: local
    # The only one with a channel: the bot is its face.
    telegram: true
    memory_provider: holographic
    # Autosaves are free to land; flip to true to review them with /memory pending.
    memory_write_approval: false
    # Nightly deterministic consolidation of the fact store: no model call unless
    # the wake gate finds something worth asking about.
    plugins:
      - hermes-dreaming
    soul: |
      # default

      You are **default**, the cautious agent of a self-hosted homelab.

      Ask before anything destructive, stay inside the paths you were given, and
      say what you are about to do before you do it. When nobody answers, find
      another way instead of insisting.
    deny:
      - "rm -rf /*"
      - "mkfs*"
      - "dd *of=/dev/*"

  # Nothing in the way: this is the one that does the work.
  uncensored:
    approvals_mode: "off"
    unattended_mode: "approve"
    terminal_backend: local
    # Its turns are long tool runs; a review fork after each one is a second
    # 35B call on the same card.
    background_review: false
    memory_provider: holographic
    memory_write_approval: false
    plugins: []
    soul: |
      # uncensored

      You are **uncensored**, the agent of a self-hosted homelab.

      You have the whole host: shell, Docker and the pool. Do the work, do not
      ask, and report what you changed.
# On demand: ComfyUI needs the whole card, so the GPU panel starts it in Image mode.
comfyui_version: v0.42.5
comfyui_gguf_nodes_version: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
comfyui_ipadapter_nodes_version: a0f451a5113cf9becb0847b92884cb10cbdec0ef
comfyui_models_path: /mnt/data/image_models
comfyui_workspace: /mnt/data/comfyui_workspace
comfyui_output_path: /mnt/data/comfyui_output
# fp16 forced and SDPA only: torch on Pascal has no faster path (see docs/comfyui.md).
comfyui_args: >-
  --force-fp16 --use-pytorch-cross-attention --disable-smart-memory
  --reserve-vram 0.75 --preview-method none --disable-auto-launch

stacks_on_demand:
  - comfyui

stacks:
  - name: litellm
    src: ai-services/litellm
    files:
      - { template: litellm-config.yaml.j2, dest: config.yaml }
    env:
      LITELLM_DB_PASSWORD: "{{ vault_litellm_db_password }}"
      # Explicit so the reconcile can read them from the rendered .env.
      LITELLM_DB_USER: litellm
      LITELLM_DB_NAME: litellm
      LITELLM_MASTER_KEY: "{{ vault_litellm_master_key }}"
      LITELLM_SALT_KEY: "{{ vault_litellm_salt_key }}"
    postgres:
      service: litellm-db
      container: litellm-db
      user_env: LITELLM_DB_USER
      password_env: LITELLM_DB_PASSWORD
      database_env: LITELLM_DB_NAME
    agent_keys:
      - value: "{{ vault_agent_litellm_api_key }}"
        models: "{{ agent_models }}"

  - name: searxng
    src: ai-services/searxng
    dirs:
      - { path: config }
      - { path: data/cache, owner: "977", group: "977" }
    files:
      - { template: searxng-settings.yml.j2, dest: config/settings.yml }
    env:
      SEARXNG_SECRET: "{{ vault_searxng_secret_key }}"
      SEARXNG_BASE_URL: "{{ searxng_base_url }}"

  - name: comfyui
    src: ai-services/comfyui
    build: true
    dirs:
      - { path: custom_nodes }
    env:
      COMFYUI_VERSION: "{{ comfyui_version }}"
      COMFYUI_GGUF_VERSION: "{{ comfyui_gguf_nodes_version }}"
      COMFYUI_IPADAPTER_VERSION: "{{ comfyui_ipadapter_nodes_version }}"
      COMFYUI_ARGS: "{{ comfyui_args }}"
      IMAGE_MODELS_PATH: "{{ comfyui_models_path }}"
      WORKSPACE_PATH: "{{ comfyui_workspace }}"
      OUTPUT_PATH: "{{ comfyui_output_path }}"

  - name: hermes
    src: ai-services/hermes
    # Rendered straight into the home on the pool, not bind-mounted: Hermes
    # writes config.yaml by renaming a temp file over it and a mount point gives
    # EBUSY, which broke `hermes config set` and `plugins enable`.
    dirs:
      - { path: "{{ hermes_data_root }}/workspace", owner: "10000", group: "10000", mode: "0755" }
      - { path: "{{ hermes_data_root }}/profiles/uncensored", owner: "10000", group: "10000", mode: "0700" }
    files:
      # `agent:` picks the entry in hermes_agents each file is rendered from.
      - { template: hermes-config.yaml.j2, dest: "{{ hermes_data_root }}/config.yaml", agent: default, owner: "10000", group: "10000", mode: "0600" }
      - { template: hermes-agent.env.j2, dest: "{{ hermes_data_root }}/.env", agent: default, owner: "10000", group: "10000", mode: "0600" }
      - { template: hermes-soul.md.j2, dest: "{{ hermes_data_root }}/SOUL.md", agent: default, owner: "10000", group: "10000", mode: "0644" }
      - { template: hermes-config.yaml.j2, dest: "{{ hermes_data_root }}/profiles/uncensored/config.yaml", agent: uncensored, owner: "10000", group: "10000", mode: "0600" }
      - { template: hermes-agent.env.j2, dest: "{{ hermes_data_root }}/profiles/uncensored/.env", agent: uncensored, owner: "10000", group: "10000", mode: "0600" }
      - { template: hermes-soul.md.j2, dest: "{{ hermes_data_root }}/profiles/uncensored/SOUL.md", agent: uncensored, owner: "10000", group: "10000", mode: "0644" }
      - { template: hermes-agents.md.j2, dest: "{{ hermes_data_root }}/workspace/AGENTS.md", agent: default, owner: "10000", group: "10000", mode: "0644" }
    env:
      HERMES_DATA: "{{ hermes_data_root }}"
      HERMES_DASHBOARD_USER: admin
      HERMES_DASHBOARD_PASSWORD: "{{ vault_hermes_dashboard_password }}"
      HERMES_DASHBOARD_SECRET: "{{ vault_hermes_dashboard_secret }}"

  - name: gpu-panel
    src: app-services/gpu-panel
    build: true
    env:
      PANEL_USER: admin
      PANEL_PASSWORD: "{{ vault_gpu_panel_password }}"
      PANEL_TOKEN: "{{ vault_gpu_panel_token }}"
      LLAMA_URL: "http://{{ ansible_host }}:{{ llamacpp_port }}"
      # The card is driven over SSH to the PVE: an unprivileged container cannot
      # set the power limit, and the same key reaches Immich and Jellyfin.
      PVE_HOST: "root@{{ hostvars['pve'].ansible_host }}"
      IMMICH_HOST: "root@{{ hostvars['immich'].ansible_host }}"
      FRONTEND_HOST: "root@{{ hostvars['frontend'].ansible_host }}"
      # Jellyfin's config on that host, read over the same SSH: the path follows
      # stacks_root so the panel has no /opt/docker of its own.
      JELLYFIN_XML: "{{ stacks_root }}/jellyfin/config/encoding.xml"
      AI_CTID: "126"   # this container, for llama-server's journald logs
      # Over the LAN: inside the panel container 127.0.0.1 is the panel itself.
      COMFY_URL: "http://{{ ansible_host }}:{{ service_ports.comfyui }}"
      COMFY_UI_URL: "https://comfy.{{ vault_domainname_hs }}/"
      COMFY_CONTAINER: comfyui
      # Only these ids are ever printed; anything else the router serves stays unnamed.
      LLAMA_PUBLIC_MODELS: "{{ llm_models | map(attribute='name') | join(',') }}"

health_checks:
  - { name: litellm,   url: "http://127.0.0.1:{{ service_ports.litellm }}/health/liveliness" }
  - { name: searxng,   url: "http://127.0.0.1:{{ service_ports.searxng }}/healthz" }
  - { name: gpu-panel, url: "http://127.0.0.1:{{ service_ports.gpu_panel }}/api/session" }
