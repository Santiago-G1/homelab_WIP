---
# P100 (sm_60). llama.cpp runs bare metal in router mode; LiteLLM, SearXNG,
# Hermes and ComfyUI are Compose stacks on the same host. Build defaults live in
# roles/llamacpp/defaults, the driver version in group_vars/gpu.

llm_ctid: 126                # Proxmox container id, read by the panel
llamacpp_port: 8080          # read by LiteLLM and the panel too

litellm_api_base: "http://{{ ansible_host }}:{{ llamacpp_port }}/v1"
litellm_backend_api_key: "{{ vault_litellm_backend_api_key }}"

docker_networks:
  - ai-stack

searxng_host: searxng
searxng_container_port: 8080            # on the LAN 8080 is llama.cpp
searxng_uid: "977"
searxng_gid: "977"
searxng_instance_name: "Homelab search"
searxng_base_url: "https://search.{{ vault_domainname_hs }}/"

# Models marked `fast: true` in models.yml are kept on the local SSD.
llamacpp_fast_models_dir: /var/lib/llama/models
llamacpp_fast_models: "{{ llm_models | selectattr('fast', 'defined') | map(attribute='name') | list }}"

# --- Hermes agents -------------------------------------------------------
# One container per agent; its state lives on the pool.
hermes_litellm_uri: "http://litellm-proxy:{{ service_ports.litellm }}/v1"
# Container port, not the published one: both stacks share `ai-stack`.
hermes_searxng_uri: "http://{{ searxng_host }}:{{ searxng_container_port }}"
hermes_data_root: /mnt/data/hermes   # one home; the profiles live inside
hermes_uid: "10000"                  # the hermes user inside the container
hermes_gid: "10000"

hermes_agents:
  # Asks before acting; finds another way when nobody answers.
  default:
    approvals_mode: "smart"
    unattended_mode: "deny"
    terminal_backend: local
    # The only one with a Telegram channel.
    telegram: true
    memory_provider: holographic
    # Set to true to review automatic writes with /memory pending.
    memory_write_approval: false
    # Nightly consolidation of the fact store.
    plugins:
      - hermes-dreaming
    soul: |
      # default

      You are **default**, the cautious agent of a self-hosted homelab.

      Ask before anything destructive, stay inside the paths you were given, and
      say what you are about to do before you do it. When nobody answers, find
      another way instead of insisting.
    deny:
      - "rm -rf /*"
      - "mkfs*"
      - "dd *of=/dev/*"

  # No approvals: this is the one that does the work.
  uncensored:
    approvals_mode: "off"
    unattended_mode: "approve"
    terminal_backend: local
    # A review fork after each turn would be a second 35B call.
    background_review: false
    memory_provider: holographic
    memory_write_approval: false
    plugins: []
    soul: |
      # uncensored

      You are **uncensored**, the agent of a self-hosted homelab.

      You have the whole host: shell, Docker and the pool. Do the work, do not
      ask, and report what you changed.
# On demand: ComfyUI needs the whole card, so the GPU panel starts it in Image mode.
comfyui_version: v0.42.5
comfyui_gguf_nodes_version: 6ea2651e7df66d7585f6ffee804b20e92fb38b8a
comfyui_ipadapter_nodes_version: a0f451a5113cf9becb0847b92884cb10cbdec0ef
comfyui_models_path: /mnt/data/image_models
comfyui_workspace: /mnt/data/comfyui_workspace
comfyui_output_path: /mnt/data/comfyui_output
# fp16 forced and SDPA only: torch on Pascal has no faster path (see docs/comfyui.md).
comfyui_args: >-
  --force-fp16 --use-pytorch-cross-attention --disable-smart-memory
  --reserve-vram 0.75 --preview-method none --disable-auto-launch

stacks_on_demand:
  - comfyui

stacks:
  - name: litellm
    src: ai-services/litellm
    files:
      - { template: litellm-config.yaml.j2, dest: config.yaml }
    env:
      LITELLM_DB_PASSWORD: "{{ vault_litellm_db_password }}"
      # Read back from the rendered .env by the postgres reconcile.
      LITELLM_DB_USER: litellm
      LITELLM_DB_NAME: litellm
      LITELLM_MASTER_KEY: "{{ vault_litellm_master_key }}"
      LITELLM_SALT_KEY: "{{ vault_litellm_salt_key }}"
    postgres:
      service: litellm-db
      container: litellm-db
      user_env: LITELLM_DB_USER
      password_env: LITELLM_DB_PASSWORD
      database_env: LITELLM_DB_NAME
    agent_keys:
      - value: "{{ vault_agent_litellm_api_key }}"
        models: "{{ agent_models }}"

  - name: searxng
    src: ai-services/searxng
    dirs:
      - { path: config }
      - { path: data/cache, owner: "{{ searxng_uid }}", group: "{{ searxng_gid }}" }
    files:
      - { template: searxng-settings.yml.j2, dest: config/settings.yml }
    env:
      SEARXNG_SECRET: "{{ vault_searxng_secret_key }}"
      SEARXNG_BASE_URL: "{{ searxng_base_url }}"

  - name: comfyui
    src: ai-services/comfyui
    build: true
    dirs:
      - { path: custom_nodes }
    env:
      COMFYUI_VERSION: "{{ comfyui_version }}"
      COMFYUI_GGUF_VERSION: "{{ comfyui_gguf_nodes_version }}"
      COMFYUI_IPADAPTER_VERSION: "{{ comfyui_ipadapter_nodes_version }}"
      COMFYUI_ARGS: "{{ comfyui_args }}"
      IMAGE_MODELS_PATH: "{{ comfyui_models_path }}"
      WORKSPACE_PATH: "{{ comfyui_workspace }}"
      OUTPUT_PATH: "{{ comfyui_output_path }}"

  - name: hermes
    src: ai-services/hermes
    # Hermes replaces its config by rename: it has to live on the pool.
    dirs:
      - { path: "{{ hermes_data_root }}/workspace", owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0755" }
      - { path: "{{ hermes_data_root }}/profiles/uncensored", owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0700" }
      # Cron runs the plugin's gate scripts from here, as the hermes user.
      - { path: "{{ hermes_data_root }}/scripts", owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0755" }
    files:
      # `agent:` picks the entry in hermes_agents each file is rendered from.
      # config.yaml and .env are seeded only (force: false): Hermes writes to both
      # at runtime (config version, multiplexed profiles, the Telegram home
      # channel, its own API key) and a re-render would throw that away.
      - { template: hermes-config.yaml.j2, dest: "{{ hermes_data_root }}/config.yaml", agent: default, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0600", force: false }
      - { template: hermes-agent.env.j2, dest: "{{ hermes_data_root }}/.env", agent: default, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0600", force: false }
      - { template: hermes-soul.md.j2, dest: "{{ hermes_data_root }}/SOUL.md", agent: default, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0644" }
      - { template: hermes-config.yaml.j2, dest: "{{ hermes_data_root }}/profiles/uncensored/config.yaml", agent: uncensored, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0600", force: false }
      - { template: hermes-agent.env.j2, dest: "{{ hermes_data_root }}/profiles/uncensored/.env", agent: uncensored, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0600", force: false }
      - { template: hermes-soul.md.j2, dest: "{{ hermes_data_root }}/profiles/uncensored/SOUL.md", agent: uncensored, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0644" }
      - { template: hermes-agents.md.j2, dest: "{{ hermes_data_root }}/workspace/AGENTS.md", agent: default, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0644" }
      - { template: hermes-dreaming.json.j2, dest: "{{ hermes_data_root }}/dreaming.json", agent: default, owner: "{{ hermes_uid }}", group: "{{ hermes_gid }}", mode: "0600" }
    env:
      HERMES_DATA: "{{ hermes_data_root }}"
      HERMES_DASHBOARD_USER: admin
      HERMES_DASHBOARD_PASSWORD: "{{ vault_hermes_dashboard_password }}"
      HERMES_DASHBOARD_SECRET: "{{ vault_hermes_dashboard_secret }}"

  - name: gpu-panel
    src: app-services/gpu-panel
    build: true
    env:
      PANEL_USER: admin
      PANEL_PASSWORD: "{{ vault_gpu_panel_password }}"
      PANEL_TOKEN: "{{ vault_gpu_panel_token }}"
      LLAMA_URL: "http://{{ ansible_host }}:{{ llamacpp_port }}"
      # The cards are driven over SSH: a container cannot set a power limit.
      PVE_HOST: "root@{{ hostvars['pve'].ansible_host }}"
      IMMICH_HOST: "root@{{ hostvars['immich'].ansible_host }}"
      FRONTEND_HOST: "root@{{ hostvars['frontend'].ansible_host }}"
      # Read over the same SSH; the path follows stacks_root.
      JELLYFIN_XML: "{{ stacks_root }}/jellyfin/config/encoding.xml"
      AI_CTID: "{{ llm_ctid }}"     # for llama-server's journald logs
      # Over the LAN: inside the container 127.0.0.1 is the panel itself.
      COMFY_URL: "http://{{ ansible_host }}:{{ service_ports.comfyui }}"
      COMFY_UI_URL: "https://comfy.{{ vault_domainname_hs }}/"
      COMFY_CONTAINER: comfyui
      # Only these ids are ever shown; anything else stays unnamed.
      LLAMA_PUBLIC_MODELS: "{{ llm_models | map(attribute='name') | join(',') }}"

health_checks:
  - { name: litellm,   url: "http://127.0.0.1:{{ service_ports.litellm }}/health/liveliness" }
  - { name: searxng,   url: "http://127.0.0.1:{{ service_ports.searxng }}/healthz" }
  - { name: gpu-panel, url: "http://127.0.0.1:{{ service_ports.gpu_panel }}/api/session" }
