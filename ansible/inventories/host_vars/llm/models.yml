---
# The single place to add, remove or switch local models. Everything else in
# this host (LiteLLM's model list, the router presets, the agent's model) is
# derived from here. See docs/llm-models.md.
#
#   name  the .gguf file name WITHOUT its extension; must exist in
#         llamacpp_models_dir and is the name clients send.
#   args  per-model llama-server options (default: llamacpp_global_args).
#   agent set on exactly one model: the one ZeroClaw talks to.
llm_models:
  # Bigger ubatch means fewer graph launches. Measured on the P100 @ 512
  # defaults: 9B pp2048 614 -> 781 t/s at ub 2048; the 12-13 GiB models become
  # unstable there (VRAM pressure), so they stay at 1024: 35B-A3B pp2048
  # 486 -> 669 t/s, 27B pp2048 134 -> 153 t/s. Decode is unaffected.
  - name: Qwen3.5-9B-UD-Q4_K_XL
    args:
      n-gpu-layers: 99
      ctx-size: 8192
      flash-attn: "on"
      batch-size: 4096
      ubatch-size: 2048
  - name: Qwen3.6-35B-A3B-UD-IQ3_S
    args:
      n-gpu-layers: 99
      ctx-size: 8192
      flash-attn: "on"
      batch-size: 2048
      ubatch-size: 1024
  - name: Qwen3.8-27B-UD-IQ4_XS
    args:
      n-gpu-layers: 99
      ctx-size: 8192
      flash-attn: "on"
      batch-size: 2048
      ubatch-size: 1024
  - name: Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp
    args:
      n-gpu-layers: 99
      ctx-size: 65536
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 512
      spec-type: draft-mtp
      spec-draft-n-max: 3
      spec-draft-ngl: 99
      spec-draft-type-k: q8_0
      spec-draft-type-v: q8_0
  - name: Swift-1.5-Qwen3.8-27B-GSQ-RCO-IQ3_S-mtp
    args:
      n-gpu-layers: 99
      ctx-size: 62536
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 512
      spec-type: draft-mtp
      spec-draft-n-max: 3
      spec-draft-ngl: 99
      spec-draft-type-k: f16
      spec-draft-type-v: f16
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      presence-penalty: 0.0
      repeat-penalty: 1.0
      cache-ram: 2048
      cache-reuse: 256

  # Coding fine-tune of the same shape (unsloth-dynamic tiers, MTP head at Q3_K).
  # UD-Q4_K_XL is the card's "start here". Measured on the two P100s with f16 KV:
  # decode 60-71 t/s (acceptance ~73 %), 278 t/s prefill and 36 t/s decode over a
  # full 244k-token prompt, 14.3 + 14.7 GiB. Drafting past 3 tokens halves the
  # acceptance, and ub 2048 buys nothing at 6k while eating the VRAM headroom.
  - name: Cyber-Tiel-Coder-35B-A3B-MTP-UD-Q4_K_XL
    args:
      n-gpu-layers: 99
      ctx-size: 262144
      cache-type-k: f16
      cache-type-v: f16
      flash-attn: "on"
      split-mode: layer
      tensor-split: "1,1"
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024
      spec-type: draft-mtp
      spec-draft-n-max: 3
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: f16
      spec-draft-type-v: f16
      jinja: "on"
      # Model card, agentic coding.
      temp: 0.6
      top-p: 0.95
      top-k: 20
      min-p: 0.0

  # MTP build: it carries the blk.40 draft head (the non-MTP file does not),
  # so speculative decoding works: decode 56-69 t/s vs 32.4, acceptance 58-69%.
  # The full 262144 window costs 14.2 + 14.9 GiB of the 2x16 GB, so ub 1024 and
  # a single slot are the stable point (ub 2048 dies on a long prefill).
  - name: Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL
    agent: true
    args:
      n-gpu-layers: 99
      ctx-size: 262144
      # The spare VRAM pays for f16; q8_0 is the floor.
      cache-type-k: f16
      cache-type-v: f16
      flash-attn: "on"
      split-mode: layer
      tensor-split: "1,1"
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024
      spec-type: draft-mtp
      spec-draft-n-max: 3
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: f16
      spec-draft-type-v: f16
      jinja: "on"
      # Qwen3.6 model card, thinking mode.
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      presence-penalty: 1.5
      repeat-penalty: 1.0

  # 131k is the model's full window, and it is what fits: the QAD-Q4_0 build is
  # 13.6 GB, so weights + the main q8_0 KV (only 10 of the 40 layers attend, so
  # ~10.6 KiB/token) + buffers leave ~1.3 GB free on the 16 GB card.
  # That is not enough for the DSpark drafter (~1.5 GB: 0.66 GB weights + its
  # own q8 KV + prefill buffers), so it is downloaded but NOT enabled: with it
  # the window drops to ~100k and the server still dies on the first long
  # prefill. See docs/llm-models.md before turning spec decoding back on.
  - name: LFM2.5-24B-A2B-QAD-Q4_0
    args:
      n-gpu-layers: 99
      ctx-size: 196608
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      fit: "off"
      parallel: 2
      kv-unified: "on"
      batch-size: 2048
      ubatch-size: 512
      jinja: "on"
      # The sampling defaults the model card and the GGUF metadata both carry.
      temp: 0.1
      top-k: 50
      repeat-penalty: 1.05
# Derived from llm_models; edit the list above instead.
litellm_models: "{{ llm_models | map(attribute='name') | list }}"
llamacpp_model_overrides: >-
  {{ llm_models | selectattr('args', 'defined')
     | items2dict(key_name='name', value_name='args') }}
zeroclaw_model: "{{ (llm_models | selectattr('agent', 'defined') | first).name }}"
