---
# The models this host serves; the router preset, the gateway allow-list, the
# agent's model and the dashboard are derived from it. docs/llm-models.md.
# Flags: agent (the agent's default model), profile (that hermes profile's
# default), fast (SSD). Every model here is reachable by the agent.
# load-mode: dio everywhere: no model here fits the 3 GiB ARC.
llm_models_catalogue:
  - name: Swift-1.5-Qwen3.8-27B-Q4_1-BF16
    agent: true
    fast: true
    args:
      model: "{{ llamacpp_models_dir }}/Swift-1.5-Qwen3.8-27B-Q4_1-BF16.gguf"
      load-mode: dio
      n-gpu-layers: 99
      # q8_0 KV is what buys the full 262144 window; f16 stops at ~152k.
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: "1,0.95"
      fit: "off"
      # One slot: a dense model splits one pass across slots, and one model is
      # resident anyway.
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024   # 2048 is +6.3 % prefill but OOMs with a vision
      # request at 262k in production (22-nov): keep 1024.
      spec-type: draft-mtp
      spec-draft-n-max: 2
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: q8_0
      spec-draft-type-v: q8_0
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Per-entry prompt cache: a state that does not fit is dropped and the prompt is
      # processed again.
      cache-ram: 9216
      # The projector for both presets, requantised to f16: the P100 has no native
      # bf16, and the 256 floor stops padding a 512 px image to 1083 tokens.
      mmproj: "{{ llamacpp_models_dir }}/mmproj-Q8_0-ajgazin.gguf"
      mmproj-device: CUDA1
      image-min-tokens: 256
      # Caps vision tokens per image: without it a large image needs a 472 MiB graph
      # (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512
      slot-save-path: /mnt/data/kv/default
  - name: Swift-1.5-Qwen3.8-27B-Q4_1-BF16:deep
    args:
      comment: |
        # Same weights, shallower MTP draft for long context.
        # A tagged section inherits nothing from the untagged one, so the path is explicit.
      model: /mnt/data/models/Swift-1.5-Qwen3.8-27B-Q4_1-BF16.gguf
      load-mode: dio
      n-gpu-layers: 99
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: 1,0.95
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024   # 2048 is +6.3 % prefill but OOMs with a vision
      # request at 262k in production (22-nov): keep 1024.
      spec-type: draft-mtp
      spec-draft-n-max: 2
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: q8_0
      spec-draft-type-v: q8_0
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Per-entry prompt cache: a state that does not fit is dropped and the prompt is
      # processed again.
      cache-ram: 9216
      # The projector for both presets, requantised to f16: the P100 has no native
      # bf16, and the 256 floor stops padding a 512 px image to 1083 tokens.
      mmproj: /mnt/data/models/mmproj-Q8_0-ajgazin.gguf
      mmproj-device: CUDA1
      image-min-tokens: 256
      # Caps vision tokens per image: without it a large image needs a 472 MiB graph
      # (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512
      slot-save-path: /mnt/data/kv/default
  - name: Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16
    profile: uncensored
    fast: true        # keep on the local SSD
    args:
      model: "{{ llamacpp_models_dir }}/Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16.gguf"
      load-mode: dio
      n-gpu-layers: 99
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: "1,0.95"
      fit: "off"
      parallel: 1          # dense: see Swift above
      batch-size: 2048
      ubatch-size: 1024   # 2048 is +6.3 % prefill but OOMs with a vision
      # request at 262k in production (22-nov): keep 1024.
      spec-type: draft-mtp
      spec-draft-n-max: 2
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: q8_0
      spec-draft-type-v: q8_0
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Per-entry prompt cache: a state that does not fit is dropped and the prompt is
      # processed again.
      cache-ram: 9216
      # The uncensored model's own projector, requantised to f16 for the P100.
      # It is not part of the model file, so a VL quant is blind without it.
      mmproj: "{{ llamacpp_models_dir }}/mmproj-Q8_0-ajgazin.gguf"
      # The 27B fills one card, so the encode graph goes on the card with headroom.
      mmproj-device: CUDA1
      # The floor only pads small images: 1024 costs ~3.4x the vision tokens of 256.
      image-min-tokens: 256
      # Caps vision tokens per image: without it a large image needs a 472 MiB graph
      # (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512
      slot-save-path: /mnt/data/kv/uncensored
  - name: Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16:deep
    args:
      model: /mnt/data/models/Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16.gguf
      load-mode: dio
      n-gpu-layers: 99
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: 1,0.95
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024   # 2048 is +6.3 % prefill but OOMs with a vision
      # request at 262k in production (22-nov): keep 1024.
      spec-type: draft-mtp
      spec-draft-n-max: 2
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: q8_0
      spec-draft-type-v: q8_0
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Per-entry prompt cache: a state that does not fit is dropped and the prompt is
      # processed again.
      cache-ram: 9216
      mmproj: /mnt/data/models/mmproj-Q8_0-ajgazin.gguf
      mmproj-device: CUDA1
      image-min-tokens: 256
      # Caps vision tokens per image: without it a large image needs a 472 MiB graph
      # (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512


# Window for a model that sets none: the router's `[*]` preset and what hermes is
# told.
llm_default_ctx: 8192
# Ceiling for a window nobody sized by hand (one command add, see llm-model-add).
llm_max_ctx: 65536

# models.local.yml is the operator's own list; it wins on a name clash.
llm_models: >-
  {{ ((llm_models_local | default([])) + llm_models_catalogue)
     | unique(attribute='name') }}

# `{model: {context_length: N}}`, pushed with `hermes config set` (stack.yml).
llm_model_contexts: >-
  {%- set out = {} -%}
  {%- for m in llm_models if ':' not in m.name -%}
  {%- set _ = out.update({m.name: {'context_length': ((m.args | default({})).get('ctx-size', (m.args | default({})).get('c', llm_default_ctx))) | int}}) -%}
  {%- endfor -%}
  {{ out }}

# Derived; edit the lists above instead.
llamacpp_model_overrides: >-
  {{ llm_models | selectattr('args', 'defined')
     | items2dict(key_name='name', value_name='args') }}
agent_model: "{{ (llm_models | selectattr('agent', 'defined') | first).name }}"
profile_models: >-
  {{ llm_models | selectattr('profile', 'defined')
     | items2dict(key_name='profile', value_name='name') }}
      slot-save-path: /mnt/data/kv/uncensored