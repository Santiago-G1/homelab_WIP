---
# The models this host serves; the router preset, the gateway allow-list, the
# agent's model and the dashboard are derived from it. docs/llm-models.md.
# Flags: agent (the agent's default model), profile (that hermes profile's
# default), fast (SSD). Every model here is reachable by the agent.
# load-mode: dio everywhere: no model here fits the 3 GiB ARC.
llm_models_catalogue:
  - name: Swift-1.5-Qwen3.8-27B-Q4_1-BF16
    agent: true
    fast: true
    args:
      model: "{{ llamacpp_models_dir }}/Swift-1.5-Qwen3.8-27B-Q4_1-BF16.gguf"
      load-mode: dio
      n-gpu-layers: 99
      # q8_0 KV is what buys the full 262144 window; f16 stops at ~152k.
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: "1,0.95"
      fit: "off"
      # One slot: a dense model splits one pass across slots, so more of them
      # only makes each answer slower. Only one model is resident anyway.
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024   # 2048 daba +5,7 % prefill pero no dejaba hueco para el grafo
                          # de vision a 262k (OOM de 472 MiB, 21-nov). 1024 cuadra las dos cosas.
      spec-type: draft-mtp
      spec-draft-n-max: 1
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: f16
      spec-draft-type-v: f16
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Prompt states: 3.4-4.3 GB at 40k, 8555 MiB at 101k. The limit is per entry and
      # a state that does not fit is discarded silently (419 s per return, 21-nov).
      cache-ram: 9216
      # Vision: the projector is what turns pixels into tokens. Both models use
      # this one (the uncensored weights' projector): the P100 has no native
      # bf16, so f16 encodes 2.5-3.8% faster, and the floor at 256 (was 1024)
      # stops padding a 512 px image up to 1083 vision tokens.
      mmproj: "{{ llamacpp_models_dir }}/mmproj-F16-ajgazin.gguf"
      mmproj-device: CUDA1
      image-min-tokens: 256
      # Techo de tokens por imagen: sin el, la resolucion dinamica de Qwen3-VL
      # partia una imagen grande en ~100 chunks y pedia un grafo de 472 MiB (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512
      slot-save-path: /mnt/data/kv/default
  - name: Swift-1.5-Qwen3.8-27B-Q4_1-BF16:deep
    args:
      comment: |
        # same weights as the preset above, shallower MTP draft for long context (OPTLOG 345).
        # a tagged section does not inherit the untagged one and the tag cannot resolve the gguf,
        # so the model path has to be explicit here.
      model: /mnt/data/models/Swift-1.5-Qwen3.8-27B-Q4_1-BF16.gguf
      load-mode: dio
      n-gpu-layers: 99
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: 1,0.95
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024
      spec-type: draft-mtp
      spec-draft-n-max: 1
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: f16
      spec-draft-type-v: f16
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Prompt states: 3.4-4.3 GB at 40k, 8555 MiB at 101k. The limit is per entry and
      # a state that does not fit is discarded silently (419 s per return, 21-nov).
      cache-ram: 9216
      # Vision: the projector is what turns pixels into tokens. Both models use
      # this one (the uncensored weights' projector): the P100 has no native
      # bf16, so f16 encodes 2.5-3.8% faster, and the floor at 256 (was 1024)
      # stops padding a 512 px image up to 1083 vision tokens.
      mmproj: /mnt/data/models/mmproj-F16-ajgazin.gguf
      mmproj-device: CUDA1
      image-min-tokens: 256
      # Techo de tokens por imagen: sin el, la resolucion dinamica de Qwen3-VL
      # partia una imagen grande en ~100 chunks y pedia un grafo de 472 MiB (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512
      slot-save-path: /mnt/data/kv/default
  - name: Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16
    profile: uncensored
    fast: true        # keep on the local SSD
    args:
      model: "{{ llamacpp_models_dir }}/Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16.gguf"
      load-mode: dio
      n-gpu-layers: 99
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: "1,0.95"
      fit: "off"
      parallel: 1          # dense: see Swift above
      batch-size: 2048
      ubatch-size: 1024   # idem: 1024 por margen de VRAM para vision a 262k
      spec-type: draft-mtp
      spec-draft-n-max: 1
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: f16
      spec-draft-type-v: f16
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Prompt states: 3.4-4.3 GB at 40k, 8555 MiB at 101k. The limit is per entry and
      # a state that does not fit is discarded silently (419 s per return, 21-nov).
      cache-ram: 9216
      # Vision: the projector is what turns pixels into tokens. It is not part
      # of the model file, so a quant of a VL model is blind without it. This
      # is the uncensored model's own projector (ajgazin), requantised to f16
      # because the P100 has no native bf16. Both presets share it.
      mmproj: "{{ llamacpp_models_dir }}/mmproj-F16-ajgazin.gguf"
      # The 27B does not fit in one card. The projector's encode graph needs
      # room to grow, so it sits on the card with headroom. Measured: same
      # speed on either card, but a 2875x1500 image OOMs the model.
      mmproj-device: CUDA1
      # The floor pads small images with interpolated pixels. Measured on a
      # 512 px image: 1024 -> 1083 vision tokens / 5.8 s vs 256 -> 315 tokens
      # / 2.9 s, same answer. Images above the floor are unaffected.
      image-min-tokens: 256
      # Techo de tokens por imagen: sin el, la resolucion dinamica de Qwen3-VL
      # partia una imagen grande en ~100 chunks y pedia un grafo de 472 MiB (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512
      slot-save-path: /mnt/data/kv/uncensored
  - name: Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16:deep
    args:
      model: /mnt/data/models/Swift-1.5-Qwen3.8-27B-Uncensored-Q4_1-BF16.gguf
      load-mode: dio
      n-gpu-layers: 99
      ctx-size: 262144
      cache-type-k: q8_0
      cache-type-v: q8_0
      flash-attn: "on"
      split-mode: tensor
      tensor-split: 1,0.95
      fit: "off"
      parallel: 1
      batch-size: 2048
      ubatch-size: 1024
      spec-type: draft-mtp
      spec-draft-n-max: 1
      spec-draft-p-min: 0.2
      spec-draft-ngl: 99
      spec-draft-n-ubatch: 64
      spec-draft-type-k: f16
      spec-draft-type-v: f16
      jinja: "on"
      temp: 1.0
      top-p: 0.95
      top-k: 20
      min-p: 0.0
      # Prompt states: 3.4-4.3 GB at 40k, 8555 MiB at 101k. The limit is per entry and
      # a state that does not fit is discarded silently (419 s per return, 21-nov).
      cache-ram: 9216
      mmproj: /mnt/data/models/mmproj-F16-ajgazin.gguf
      mmproj-device: CUDA1
      image-min-tokens: 256
      # Techo de tokens por imagen: sin el, la resolucion dinamica de Qwen3-VL
      # partia una imagen grande en ~100 chunks y pedia un grafo de 472 MiB (OOM).
      image-max-tokens: 4096
      mtmd-batch-max-tokens: 512


# Window for a model that sets none: the router's `[*]` preset, and what hermes
# is told for it.
llm_default_ctx: 8192
# Ceiling for a window nobody sized by hand (one command add, see llm-model-add).
llm_max_ctx: 65536

# models.local.yml is the operator's own list; it wins on a name clash.
llm_models: >-
  {{ ((llm_models_local | default([])) + llm_models_catalogue)
     | unique(attribute='name') }}

# `{model: {context_length: N}}`, pushed with `hermes config set` (stack.yml).
llm_model_contexts: >-
  {%- set out = {} -%}
  {%- for m in llm_models if ':' not in m.name -%}
  {%- set _ = out.update({m.name: {'context_length': ((m.args | default({})).get('ctx-size', (m.args | default({})).get('c', llm_default_ctx))) | int}}) -%}
  {%- endfor -%}
  {{ out }}

# Derived; edit the lists above instead.
llamacpp_model_overrides: >-
  {{ llm_models | selectattr('args', 'defined')
     | items2dict(key_name='name', value_name='args') }}
agent_model: "{{ (llm_models | selectattr('agent', 'defined') | first).name }}"
profile_models: >-
  {{ llm_models | selectattr('profile', 'defined')
     | items2dict(key_name='profile', value_name='name') }}
      slot-save-path: /mnt/data/kv/uncensored