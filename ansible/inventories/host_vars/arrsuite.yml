---
# Every *arr stack joins this network; Ansible creates it before the stacks.
# The name outlived the soulsync service (removed in 3d967ff): this network
# belongs to the arrsuite now, and says so.
docker_networks:
  - arrsuite-stack

stacks:
  - { name: bazarr,       src: media-services/arrsuite/bazarr }
  - { name: calibre,      src: media-services/arrsuite/calibre }
  - { name: flaresolverr, src: media-services/arrsuite/flaresolverr }
  - { name: prowlarr,     src: media-services/arrsuite/prowlarr }
  - { name: qbittorrent,  src: media-services/arrsuite/qbittorrent }
  - { name: radarr,       src: media-services/arrsuite/radarr }
  - name: seerr
    src: media-services/arrsuite/seerr
    dirs:
      # seerr mounts ./data and runs as node (uid 1000); it does not chown it.
      - { path: data, owner: "1000", group: "1000" }
  - { name: sonarr,       src: media-services/arrsuite/sonarr }
  - name: slskd
    src: media-services/arrsuite/slskd
    env:
      SLSKD_USERNAME: "{{ vault_slskd_username }}"
      SLSKD_PASSWORD: "{{ vault_slskd_password }}"
      SLSKD_API_KEY: "{{ vault_slskd_api_key }}"

# Ports come from service_ports (group_vars/all/services.yml), the same map the
# catalog uses, so a service that moves does not leave a stale check behind.
health_checks:
  - { name: bazarr,      url: "http://127.0.0.1:{{ service_ports.bazarr }}/" }
  - { name: prowlarr,    url: "http://127.0.0.1:{{ service_ports.prowlarr }}/" }
  - { name: radarr,      url: "http://127.0.0.1:{{ service_ports.radarr }}/" }
  - { name: sonarr,      url: "http://127.0.0.1:{{ service_ports.sonarr }}/" }
  - { name: qbittorrent, url: "http://127.0.0.1:{{ service_ports.qbittorrent }}/" }
  - { name: seerr,       url: "http://127.0.0.1:{{ service_ports.seerr }}/" }
  - { name: slskd,       url: "http://127.0.0.1:{{ service_ports.slskd }}/" }
  - { name: calibre,     url: "http://127.0.0.1:{{ service_ports.calibre }}/" }
