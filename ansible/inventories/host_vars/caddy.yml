---
# The Caddyfile is generated from the service catalog, which Glance reads too.
stacks:
  - name: caddy
    src: network-services/caddy
    build: true   # the Dockerfile adds the Cloudflare DNS module
    files:
      - { template: caddy-Caddyfile.j2, dest: Caddyfile }
    env:
      CLOUDFLARE_API_TOKEN: "{{ vault_cloudflare_api_token }}"

# Probed through the proxy with real SNI; the catalog decides which services.
proxy_checks: "{{ homelab_services | selectattr('verify', 'defined') | selectattr('verify') | list }}"
