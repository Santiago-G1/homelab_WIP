---
stacks:
  - name: caddy
    src: network-services/caddy
    env:
      CLOUDFLARE_API_TOKEN: "{{ vault_cloudflare_api_token }}"
      DOMAINNAME_HS:        "{{vault_domainname_hs}}"

# Reached through the proxy with real SNI, so these prove the route table works.
proxy_checks:
  - { host: "music.{{vault_domainname_hs}}" }
  - { host: "password.{{vault_domainname_hs}}"}
  - { host: "torrent. {{vault_domainname_hs}}" }
  - { host: "immich.{{vault_domainname_hs}}" }
  - { host: "blocky.{{vault_domainname_hs}}", path: /metrics } # Blocky has no UI
  - { host: "grafana.{{vault_domainname_hs}}" }
