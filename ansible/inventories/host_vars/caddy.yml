---
# The route table is generated from the service catalog, which is also what the
# Glance dashboard reads: one place declares a service, both follow.
stacks:
  - name: caddy
    src: network-services/caddy
    files:
      - { template: caddy-Caddyfile.j2, dest: Caddyfile }
    env:
      CLOUDFLARE_API_TOKEN: "{{ vault_cloudflare_api_token }}"
      # DOMAINNAME_HS is not declared here: every stack gets it, and the
      # timezone, from stack_env_common in group_vars/all/main.yml.

# Reached through the proxy with real SNI, so these prove the route table works.
# The catalog decides which services are worth probing.
proxy_checks: "{{ homelab_services | selectattr('verify', 'defined') | selectattr('verify') | list }}"
