---
- name: Build dependencies
  ansible.builtin.apt:
    name: [build-essential, cmake, git, clang, lld, llvm, libomp-dev, libcurl4-openssl-dev, gnupg]
    state: present
    update_cache: true
    cache_valid_time: 3600

# apt on trixie verifies repository signatures with Sequoia, whose policy
# stopped accepting SHA1 signatures on 2026-02-01, while NVIDIA still signs the
# CUDA repository key with SHA1: without this, apt rejects the whole repository
# and no CUDA package can be installed. See the file header for the tradeoff.
# Sequoia only reads the policy from this path when it exists, and nothing else
# creates the directory in a plain container.
- name: Create the Sequoia policy directory
  ansible.builtin.file:
    path: /etc/crypto-policies/back-ends
    state: directory
    mode: "0755"

- name: Allow the CUDA repository's SHA1-signed key in apt's Sequoia policy
  ansible.builtin.copy:
    src: apt-sequoia.config
    dest: /etc/crypto-policies/back-ends/apt-sequoia.config
    mode: "0644"

- name: Add the CUDA repository keyring
  ansible.builtin.apt:
    deb: "https://developer.download.nvidia.com/compute/cuda/repos/{{ cuda_repo_distro }}/x86_64/cuda-keyring_1.1-1_all.deb"
    state: present

# Toolkit only (nvcc + headers); the driver comes from roles/nvidia.
- name: Install the CUDA toolkit
  ansible.builtin.apt:
    name: "{{ cuda_toolkit_package }}"
    state: present
    update_cache: true
    # The CUDA repository lives behind an Akamai edge that the lab's DNS does
    # not always resolve to a reachable answer, and apt fails the whole update
    # when any configured repository is unreachable: keep the cached indexes.
    cache_valid_time: 3600

# CUDA 12.x declares sinpi/cospi/sinpif/cospif in crt/math_functions.h without an
# exception specification, while glibc 2.41 (trixie) declares the same C23
# functions noexcept(true). g++ and clang++ accept the redeclaration, but
# nvcc's cudafe++ frontend refuses to compile any translation unit that includes
# <math.h> ("exception specification is incompatible"), i.e. every CUDA file.
# The CUDA declarations get the matching specification; requiring the closing
# ";" in the pattern keeps the task idempotent, and a NVIDIA package upgrade
# that restores the original header is re-patched on the next run.
- name: Give the CUDA sinpi/cospi declarations glibc 2.41's exception specification
  ansible.builtin.replace:
    path: "{{ llamacpp_cuda_root }}/targets/x86_64-linux/include/crt/math_functions.h"
    regexp: "(__device_builtin__ (?:double|float)\\s+(?:sinpi|cospi)f?\\((?:double|float) x\\))(;)"
    replace: '\1 noexcept (true)\2'

- name: Service user
  ansible.builtin.user:
    name: llama
    system: true
    shell: /usr/sbin/nologin
    groups: video
    append: true
    create_home: false

- name: Clone llama.cpp
  ansible.builtin.git:
    repo: https://github.com/ggml-org/llama.cpp
    dest: /opt/llama.cpp
    version: "{{ llamacpp_version }}"
    force: true
  register: llamacpp_src

# Changing any build flag triggers a rebuild.
- name: Record the build flags
  ansible.builtin.copy:
    content: "{{ llamacpp_cmake_args | join('\n') }}\n{{ llamacpp_build_targets | join(' ') }}\n"
    dest: /opt/llama.cpp/.ansible-build-flags
    mode: "0644"
  register: llamacpp_flags

- name: Check whether the binary exists
  ansible.builtin.stat:
    path: /opt/llama.cpp/build/bin/llama-server
  register: llamacpp_bin

# A link interrupted by a crash leaves a truncated binary whose mtime is newer
# than every object file, so make would keep treating it as up to date and the
# service would fail to exec it ("Exec format error").
- name: Drop a truncated llama-server binary
  ansible.builtin.file:
    path: /opt/llama.cpp/build/bin/llama-server
    state: absent
  when: llamacpp_bin.stat.exists and llamacpp_bin.stat.size | default(1) == 0

- name: Set the rebuild condition
  ansible.builtin.set_fact:
    llamacpp_rebuild: "{{ llamacpp_src.changed or llamacpp_flags.changed or not llamacpp_bin.stat.exists or llamacpp_bin.stat.size | default(1) == 0 }}"

- name: Configure the build
  ansible.builtin.command:
    argv: "{{ ['cmake', '-B', 'build'] + llamacpp_cmake_args }}"
    chdir: /opt/llama.cpp
  environment:
    PATH: "{{ llamacpp_cuda_root }}/bin:{{ ansible_env.PATH }}"
  when: llamacpp_rebuild
  changed_when: true

# nvcc is memory hungry and the container has 12 GB: keep the job count low.
- name: Compile
  ansible.builtin.command:
    argv: >-
      {{ ['cmake', '--build', 'build', '-j' ~ llamacpp_build_jobs, '--target']
         + llamacpp_build_targets }}
    chdir: /opt/llama.cpp
  environment:
    PATH: "{{ llamacpp_cuda_root }}/bin:{{ ansible_env.PATH }}"
  when: llamacpp_rebuild
  changed_when: true
  notify: restart llama-server

- name: Preset directory
  ansible.builtin.file:
    path: "{{ llamacpp_preset_file | dirname }}"
    state: directory
    mode: "0755"

- name: Render the router preset
  ansible.builtin.template:
    src: models.ini.j2
    dest: "{{ llamacpp_preset_file }}"
    mode: "0644"
  notify: restart llama-server

- name: Install the systemd unit
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    mode: "0644"
  notify: restart llama-server

- name: Enable and start llama-server
  ansible.builtin.systemd:
    name: llama-server
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for llama-server to listen
  ansible.builtin.wait_for:
    port: "{{ llamacpp_port }}"
    timeout: 60
