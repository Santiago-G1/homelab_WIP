---
# Source build. `llamacpp_skip_build: true` (playbooks/llm-models.yml) skips this
# whole block, so model changes never re-fetch or recompile. See
# docs/llamacpp-build.md.
- name: Build llama.cpp from source
  when: not (llamacpp_skip_build | default(false))
  block:
    - name: Build dependencies
      ansible.builtin.apt:
        name: [build-essential, cmake, git, patch, clang, lld, llvm, libomp-dev, libcurl4-openssl-dev, gnupg]
        state: present
        update_cache: true
        cache_valid_time: 3600

    # Sequoia rejects the SHA1-signed NVIDIA repo key on trixie.
    - name: Create the Sequoia policy directory
      ansible.builtin.file:
        path: /etc/crypto-policies/back-ends
        state: directory
        mode: "0755"

    - name: Allow the CUDA repository's SHA1-signed key in apt's Sequoia policy
      ansible.builtin.copy:
        src: apt-sequoia.config
        dest: /etc/crypto-policies/back-ends/apt-sequoia.config
        mode: "0644"

    - name: Add the CUDA repository keyring
      ansible.builtin.apt:
        deb: "https://developer.download.nvidia.com/compute/cuda/repos/{{ cuda_repo_distro }}/x86_64/cuda-keyring_1.1-1_all.deb"
        state: present

    # Toolkit only; the driver comes from roles/nvidia.
    - name: Install the CUDA toolkit
      ansible.builtin.apt:
        name: "{{ cuda_toolkit_package }}"
        state: present
        update_cache: true
        cache_valid_time: 3600

    # glibc 2.41 declares the C23 sinpi/cospi noexcept; CUDA 12.x does not and
    # nvcc refuses every TU that includes <math.h>. See docs/llamacpp-build.md.
    - name: Give the CUDA sinpi/cospi declarations glibc 2.41's exception specification
      ansible.builtin.replace:
        path: "{{ llamacpp_cuda_root }}/targets/x86_64-linux/include/crt/math_functions.h"
        regexp: "(__device_builtin__ (?:double|float)\\s+(?:sinpi|cospi)f?\\((?:double|float) x\\))(;)"
        replace: '\1 noexcept (true)\2'

    - name: Clone llama.cpp
      ansible.builtin.git:
        repo: https://github.com/ggml-org/llama.cpp
        dest: /opt/llama.cpp
        version: "{{ llamacpp_version }}"
        force: true

    - name: Tools directory
      ansible.builtin.file:
        path: "{{ llamacpp_tools_dir }}"
        state: directory
        mode: "0755"

    - name: Install the patch applier and the fp16 carve-out
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ llamacpp_tools_dir }}/{{ item.dest }}"
        mode: "0755"
      loop:
        - { src: apply-patches.sh, dest: apply-patches.sh }
        - { src: carveout-sm60-fp16.py, dest: carveout-sm60-fp16.py }
      loop_control:
        label: "{{ item.dest }}"

    # The patch set is cut per llama.cpp ref and tagged with that ref's name, so
    # the default tag is llamacpp_version. Checking the ref before cloning turns
    # "bump llama.cpp to a ref the patch set has no tag for" into a one-line
    # error instead of a git failure, and names the way out.
    - name: List the patch set's refs
      ansible.builtin.command:
        argv: [git, ls-remote, "--tags", "--heads", "{{ llamacpp_p100_patches_repo }}"]
      register: llamacpp_patches_refs
      changed_when: false
      check_mode: false
      when:
        - llamacpp_p100_patches
        - not (llamacpp_p100_patches_version | regex_search('^[0-9a-f]{7,40}$'))

    - name: Fail when the patch set has no ref for this llama.cpp version
      ansible.builtin.assert:
        that:
          - ('refs/tags/' ~ llamacpp_p100_patches_version) in llamacpp_patches_refs.stdout
            or ('refs/heads/' ~ llamacpp_p100_patches_version) in llamacpp_patches_refs.stdout
        fail_msg: >-
          {{ llamacpp_p100_patches_repo }} has no tag or branch
          '{{ llamacpp_p100_patches_version }}' (derived from llamacpp_version).
          The set is cut per llama.cpp ref: build a ref it has a tag for, or set
          llamacpp_p100_patches: false to build stock. See "Bumping llama.cpp" in
          docs/llamacpp-build.md.
      when:
        - llamacpp_p100_patches
        - not (llamacpp_p100_patches_version | regex_search('^[0-9a-f]{7,40}$'))

    - name: Fetch the P100 patch set
      ansible.builtin.git:
        repo: "{{ llamacpp_p100_patches_repo }}"
        dest: "{{ llamacpp_p100_patches_dir }}"
        version: "{{ llamacpp_p100_patches_version }}"
        force: true
      when: llamacpp_p100_patches

    - name: Read the patch set's commit
      ansible.builtin.command:
        argv: [git, rev-parse, HEAD]
      args:
        chdir: "{{ llamacpp_p100_patches_dir }}"
      register: llamacpp_patches_head
      changed_when: false
      when: llamacpp_p100_patches

    - name: Collect the patch set signature
      ansible.builtin.find:
        paths: "{{ llamacpp_p100_patches_dir }}/patches"
        patterns: "*.patch"
        get_checksum: true
      register: llamacpp_patch_files
      when: llamacpp_p100_patches

    - name: Stat the fp16 carve-out
      ansible.builtin.stat:
        path: "{{ llamacpp_tools_dir }}/carveout-sm60-fp16.py"
        get_checksum: true
      register: llamacpp_carveout_script

    - name: Check whether the binary exists
      ansible.builtin.stat:
        path: /opt/llama.cpp/build/bin/llama-server
      register: llamacpp_bin

    # A truncated binary is newer than its objects, so make would skip it.
    - name: Drop a truncated llama-server binary
      ansible.builtin.file:
        path: /opt/llama.cpp/build/bin/llama-server
        state: absent
      when: llamacpp_bin.stat.exists and llamacpp_bin.stat.size | default(1) == 0

    - name: Read the recorded build signature
      ansible.builtin.slurp:
        src: /opt/llama.cpp/.ansible-build-flags
      register: llamacpp_flags_recorded
      failed_when: false

    # ---- rebuild decision -------------------------------------------------
    # Everything below is keyed off a signature of (upstream ref, patch set ref
    # and commit, cmake flags, targets, patch checksums, carve-out script). The
    # tree is only reset and re-patched when that changes: re-applying the
    # patches touches every file's mtime and would make ninja rebuild the whole
    # CUDA tree on every playbook run.
    - name: Set the build signature
      ansible.builtin.set_fact:
        llamacpp_signature: |
          llama.cpp {{ llamacpp_version }}
          patches {{ llamacpp_p100_patches_version if llamacpp_p100_patches else 'none' }} @ {{ llamacpp_patches_head.stdout | default('') }}
          {{ llamacpp_cmake_args | join('\n') }}
          {{ llamacpp_build_targets | join(' ') }}
          {{ llamacpp_patch_files.files | default([]) | map(attribute='checksum') | join('\n') }}
          {{ llamacpp_carveout_script.stat.checksum | default('none') }}

    - name: Decide whether to rebuild
      ansible.builtin.set_fact:
        llamacpp_rebuild: >-
          {{ (llamacpp_flags_recorded.content | default('') | b64decode) != llamacpp_signature
              or not llamacpp_bin.stat.exists
              or llamacpp_bin.stat.size | default(1) == 0 }}

    - name: Reset the llama.cpp tree to the requested ref
      ansible.builtin.command: git reset --hard {{ llamacpp_version }}
      args:
        chdir: /opt/llama.cpp
      changed_when: false
      when: llamacpp_rebuild

    - name: Apply the P100 patch set
      ansible.builtin.command:
        argv: "{{ [llamacpp_tools_dir ~ '/apply-patches.sh', llamacpp_p100_patches_dir ~ '/patches'] }}"
      args:
        chdir: /opt/llama.cpp
      environment:
        LLAMACPP_PATCH_OPTIONAL: "{{ llamacpp_p100_patches_optional | join(' ') }}"
        LLAMACPP_PATCH_IGNORE_MISSING: "{{ '1' if llamacpp_p100_patches_ignore_missing else '' }}"
      register: llamacpp_patch_result
      when: llamacpp_p100_patches and llamacpp_rebuild
      changed_when: true

    # Wrapped in a warning rather than a failure because the tree still builds;
    # but the numbers in docs/llamacpp-build.md no longer describe it.
    - name: Report a partially patched tree
      ansible.builtin.debug:
        msg:
          - "llamacpp_p100_patches_ignore_missing is on: a patch that no longer applies was skipped"
          - "{{ llamacpp_patch_result.stdout_lines | default([]) | join(' | ') }}"
      when:
        - llamacpp_p100_patches_ignore_missing
        - llamacpp_rebuild
        - "'skipped:' in (llamacpp_patch_result.stdout | default(''))"

    - name: Build the carve-out argv
      ansible.builtin.set_fact:
        llamacpp_carveout_argv: >-
          {{ [llamacpp_tools_dir ~ '/carveout-sm60-fp16.py']
             + (['--strict'] if llamacpp_p100_carveout_strict else [])
             + ['/opt/llama.cpp'] }}

    - name: Carve sm_60 out of the fp16 fast path (attention + mmvf)
      ansible.builtin.command:
        argv: "{{ llamacpp_carveout_argv }}"
      when: llamacpp_p100_patches and llamacpp_rebuild
      changed_when: true

    - name: Configure the build
      ansible.builtin.command:
        argv: "{{ ['cmake', '-B', 'build'] + llamacpp_cmake_args }}"
        chdir: /opt/llama.cpp
      environment:
        PATH: "{{ llamacpp_cuda_root }}/bin:{{ ansible_env.PATH }}"
      when: llamacpp_rebuild
      changed_when: true

    - name: Compile
      ansible.builtin.command:
        argv: >-
          {{ ['cmake', '--build', 'build', '-j' ~ llamacpp_build_jobs, '--target']
             + llamacpp_build_targets }}
        chdir: /opt/llama.cpp
      environment:
        PATH: "{{ llamacpp_cuda_root }}/bin:{{ ansible_env.PATH }}"
      when: llamacpp_rebuild
      changed_when: true
      notify: restart llama-server

    # Written only after a successful build, so a failed build is retried.
    - name: Record the build signature
      ansible.builtin.copy:
        content: "{{ llamacpp_signature }}"
        dest: /opt/llama.cpp/.ansible-build-flags
        mode: "0644"
      when: llamacpp_rebuild

# Outside the block: the service runs as this user, and llm-models.yml needs it.
- name: Service user
  ansible.builtin.user:
    name: llama
    system: true
    shell: /usr/sbin/nologin
    groups: video
    append: true
    create_home: false

- name: Preset directory
  ansible.builtin.file:
    path: "{{ llamacpp_preset_file | dirname }}"
    state: directory
    mode: "0755"

# Per-model options come from llm_models in host_vars/llm/models.yml.
- name: Render the router preset
  ansible.builtin.template:
    src: models.ini.j2
    dest: "{{ llamacpp_preset_file }}"
    mode: "0644"
  notify: restart llama-server

- name: Install the systemd unit
  ansible.builtin.template:
    src: llama-server.service.j2
    dest: /etc/systemd/system/llama-server.service
    mode: "0644"
  notify: restart llama-server

- name: Enable and start llama-server
  ansible.builtin.systemd:
    name: llama-server
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for llama-server to listen
  ansible.builtin.wait_for:
    port: "{{ llamacpp_port }}"
    timeout: 60
