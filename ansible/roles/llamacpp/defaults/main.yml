---
# llama.cpp ref to build: any tag, branch or commit. The P100 patch set below is
# cut per upstream ref and tagged with the same name, so this single variable
# moves both trees. See "Bumping llama.cpp" in docs/llamacpp-build.md.
llamacpp_version: v0.7.0
llamacpp_port: 8080
llamacpp_models_dir: /mnt/data/models
llamacpp_models_max: 1
llamacpp_preset_file: /etc/llama/models.ini
llamacpp_global_args:
  n-gpu-layers: 99
  c: 8192
  flash-attn: "on"
llamacpp_model_overrides: {}

cuda_toolkit_package: cuda-toolkit-12-8   # needs the glibc 2.41 patch applied in tasks/main.yml
cuda_repo_distro: debian12

# Build
llamacpp_cuda_root: /usr/local/cuda-12.8
llamacpp_cuda_arch: "60-real"          # Tesla P100 = 60
llamacpp_cuda_force_mmq: "OFF"         # sm_60 has no dp4a: forcing MMQ only slows dense models down
llamacpp_cpu_flags: "-march=ivybridge -mtune=ivybridge -O3 -fopenmp -pipe -funroll-loops"
# nvcc is memory hungry and this host has reset under 4 parallel LTO jobs:
# 2 is the safe value, and host_vars/llm keeps it explicit for the AI host.
llamacpp_build_jobs: 2
llamacpp_build_targets: [llama-server, llama-bench, llama-cli]
llamacpp_tools_dir: /opt/llama.cpp-tools

# P100 (GP100, sm_60) patch set. Not vendored here: it is maintained upstream,
# rebased for every llama.cpp ref, and tagged with that ref's name. The default
# therefore follows llamacpp_version, so bumping the version above is the whole
# upgrade. Pin a commit here instead of a tag for a byte-reproducible build —
# upstream does move its tags when it re-cuts one.
#
# shinbunbun/llama-cpp-p100-patches is the original set; this fork keeps one tag
# per upstream ref (git ls-remote --tags) and documents what each rebase drops.
llamacpp_p100_patches: true
llamacpp_p100_patches_repo: https://github.com/sbendhiba/llama-cpp-pascal-patches
llamacpp_p100_patches_version: "{{ llamacpp_version }}"
llamacpp_p100_patches_dir: /opt/llama.cpp-patches
# Patch file names that may be skipped when they no longer apply. Empty: every
# patch is required and the build stops at the first one that does not land.
llamacpp_p100_patches_optional: []
# Last resort while trying a ref the set was not cut for: skip the patches that
# no longer apply instead of failing. The tree is then only partially patched.
llamacpp_p100_patches_ignore_missing: false
# The local sm_60 fp16 carve-out (files/carveout-sm60-fp16.py) warns and carries
# on when it cannot find the gates it edits, because a gate upstream moved is a
# precision problem rather than a build failure. Set this to fail instead.
llamacpp_p100_carveout_strict: false

llamacpp_cmake_args:
  - -DCMAKE_BUILD_TYPE=Release
  - -DCMAKE_C_COMPILER=clang
  - -DCMAKE_CXX_COMPILER=clang++
  - "-DCMAKE_C_FLAGS={{ llamacpp_cpu_flags }}"
  - "-DCMAKE_CXX_FLAGS={{ llamacpp_cpu_flags }}"
  - -DCMAKE_EXE_LINKER_FLAGS=-fopenmp
  - -DCMAKE_SHARED_LINKER_FLAGS=-fopenmp
  - -DGGML_NATIVE=OFF
  - -DGGML_LTO=ON
  - -DGGML_AVX=ON
  - -DGGML_AVX2=OFF
  - -DGGML_FMA=OFF
  - -DGGML_F16C=ON
  - -DGGML_BMI2=OFF
  - -DGGML_AVX_VNNI=OFF
  - -DGGML_AVX512=OFF
  - -DGGML_LLAMAFILE=ON
  - -DGGML_OPENMP=ON
  - -DGGML_CUDA=ON
  - "-DCMAKE_CUDA_ARCHITECTURES={{ llamacpp_cuda_arch }}"
  - "-DCUDAToolkit_ROOT={{ llamacpp_cuda_root }}"
  - "-DCMAKE_CUDA_COMPILER={{ llamacpp_cuda_root }}/bin/nvcc"
  - "-DGGML_CUDA_FORCE_MMQ={{ llamacpp_cuda_force_mmq }}"
  - -DGGML_CUDA_FA=ON
  - -DGGML_CUDA_FA_ALL_QUANTS=ON
  - "-DCMAKE_CUDA_FLAGS=-O3 -Xptxas -O3"
  - -DGGML_CUDA_GRAPHS=ON
  - -DCMAKE_CUDA_HOST_COMPILER=/usr/bin/g++
  - -DGGML_CCACHE=OFF
