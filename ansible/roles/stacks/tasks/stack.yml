---
- name: "{{ stack.name }} | create the project directory"
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ stack.name }}"
    state: directory
    mode: "0755"

# rsync would replace a bind-mounted file with a source directory of the same name.
- name: "{{ stack.name }} | assert no rendered file is a directory in the source"
  ansible.builtin.assert:
    that: not ((compose_src_root ~ '/' ~ stack.src ~ '/' ~ item.dest) is directory)
    fail_msg: >-
      {{ stack.src }}/{{ item.dest }} is a directory in the repo, but Ansible
      renders it as a file: delete it (empty directories are not tracked by
      git) or drop the `files` entry.
  loop: "{{ stack.files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost
  when: stack.files is defined

# rsync, not copy, so the rendered .env is never overwritten by the repo's.
- name: "{{ stack.name }} | sync the Compose project"
  ansible.posix.synchronize:
    src: "{{ compose_src_root }}/{{ stack.src }}/"
    dest: "{{ stacks_root }}/{{ stack.name }}/"
    delete: false
    rsync_opts:
      - "--exclude=.env"
      - "--exclude=.env.template"
      # Modes and owners of runtime dirs belong to the `dirs` task below.
      - "--no-owner"
      - "--no-group"
      - "--no-perms"
      - "--omit-dir-times"
  register: stack_sync

- name: "{{ stack.name }} | create data directories"
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ stack.name }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ stack.dirs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

# stack_env_common applies even to stacks that declare no `env`.
- name: "{{ stack.name }} | render .env"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stacks_root }}/{{ stack.name }}/.env"
    mode: "0600"

- name: "{{ stack.name }} | render extra configuration files"
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ stacks_root }}/{{ stack.name }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    # Only when the entry asks for it: a container running as a non-root user
    # (alertmanager as nobody) needs the owner set too.
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
  loop: "{{ stack.files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: stack_files

# Services behind a Compose profile are built here on purpose: the profile keeps
# them out of `up`, and only their image is wanted.
- name: "{{ stack.name }} | build the images declared for the stack"
  ansible.builtin.command:
    cmd: >-
      docker compose --profile {{ stack.build_profile | default('tools') }}
      build {{ stack.build_services | join(' ') }}
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  when: (stack.build_services | default([])) | length > 0
  register: stack_build
  changed_when: "'Successfully built' in stack_build.stdout"

# POSTGRES_USER/POSTGRES_PASSWORD are only read by the first initdb, so a vault
# rotation leaves the cluster with the old roles and the app dies on 28P01.
- name: "{{ stack.name }} | reconcile the Postgres credentials"
  ansible.builtin.script: >-
    postgres-credentials.sh
    {{ stacks_root }}/{{ stack.name }}
    {{ stack.postgres.service }}
    {{ stack.postgres.container }}
    {{ stack.postgres.user_env }}
    {{ stack.postgres.password_env }}
    {{ stack.postgres.database_env }}
  register: postgres_creds
  changed_when: "'changed=1' in postgres_creds.stdout"
  when: stack.postgres is defined

- name: "{{ stack.name }} | bring the stack up"
  ansible.builtin.command:
    cmd: "docker compose up -d --remove-orphans{{ ' --build' if stack.build | default(false) else '' }}"
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  register: compose_up
  changed_when: >-
    'Started' in compose_up.stdout or 'Created' in compose_up.stdout
    or 'Recreated' in compose_up.stdout

# Config files are bind mounted, so `up` alone would not pick up a rewrite.
- name: "{{ stack.name }} | restart after configuration changes"
  ansible.builtin.command:
    cmd: docker compose restart
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  when: stack_files.changed | default(false) or stack_sync.changed | default(false)
  changed_when: true

# LiteLLM keeps a key's model allowlist in its database, not in config.yaml.
- name: "{{ stack.name }} | reconcile the virtual keys' model access"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stack.admin_port | default(4000) }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_litellm_master_key }}"
    body_format: json
    body:
      key: "{{ item.value }}"
      models: "{{ item.models }}"
    status_code: [200]
  loop: "{{ stack.agent_keys | default([]) }}"
  loop_control:
    label: agent key
  register: key_reconcile
  until: key_reconcile is succeeded
  retries: 12
  delay: 5
  no_log: true
  changed_when: false
  when: stack.agent_keys is defined
