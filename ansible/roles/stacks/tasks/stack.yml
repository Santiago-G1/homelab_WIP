---
- name: "{{ stack.name }} | create the project directory"
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ stack.name }}"
    state: directory
    mode: "0755"

# A stack declares one source and only one: `src:` is a directory in this
# repository, `repo:` a repository of its own.
- name: "{{ stack.name }} | assert the project has exactly one source"
  ansible.builtin.assert:
    that: (stack.src is defined) != (stack.repo is defined)
    fail_msg: >-
      {{ stack.name }} declares
      {{ 'both' if (stack.src is defined and stack.repo is defined) else 'neither' }}
      of `src:` and `repo:`; it needs exactly one.
    quiet: true

# The address reaches docker compose verbatim, so a bad one fails the `up` there.
- name: "{{ stack.name }} | check the declared publish address"
  ansible.builtin.include_tasks: assert_publish_addr.yml
  when: stack.publish_addr is defined

# rsync would replace a bind-mounted file with a source directory of the same name.
- name: "{{ stack.name }} | assert no rendered file is a directory in the source"
  ansible.builtin.assert:
    that: >-
      item.dest.startswith('/')
      or not ((compose_src_root ~ '/' ~ stack.src ~ '/' ~ item.dest) is directory)
    fail_msg: >-
      {{ stack.src }}/{{ item.dest }} is a directory in the repo, but Ansible
      renders it as a file: delete it (empty directories are not tracked by
      git) or drop the `files` entry.
  loop: "{{ stack.files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost
  when: stack.src is defined and stack.files is defined

# rsync, not copy, so the rendered .env is never overwritten by the repo's.
- name: "{{ stack.name }} | sync the Compose project from this repository"
  ansible.posix.synchronize:
    src: "{{ compose_src_root }}/{{ stack.src }}/"
    dest: "{{ stacks_root }}/{{ stack.name }}/"
    delete: false
    rsync_opts:
      - "--exclude=.env"
      - "--exclude=.env.template"
      # Python bytecode from a local run is not part of the project.
      - "--exclude=__pycache__"
      - "--exclude=*.pyc"
      # Modes and owners of runtime dirs belong to the `dirs` task below.
      - "--no-owner"
      - "--no-group"
      - "--no-perms"
      - "--omit-dir-times"
  register: stack_sync
  when: stack.src is defined

# The checkout is the deployed copy: `force` discards local edits on purpose.
# The rendered .env is gitignored upstream, so it survives the checkout.
- name: "{{ stack.name }} | stat the checkout"
  ansible.builtin.stat:
    path: "{{ stacks_root }}/{{ stack.name }}/.git"
  register: stack_checkout
  when: stack.repo is defined

- name: "{{ stack.name }} | list what is already in the project directory"
  ansible.builtin.find:
    paths: "{{ stacks_root }}/{{ stack.name }}"
    patterns: "*"
    hidden: true
    file_type: any
  register: stack_entries
  when: stack.repo is defined

# git only clones into an empty directory: move any older copy aside.
# The rendered .env needs no saving: it is rewritten below on this run.
- name: "{{ stack.name }} | assert the directory can hold the checkout"
  ansible.builtin.assert:
    that: stack_entries.matched == 0 or stack_checkout.stat.exists
    fail_msg: >-
      {{ stacks_root }}/{{ stack.name }} has files but no .git, so it cannot be
      cloned over: this stack moved to its own repository. Move the directory
      aside and run the playbook again.
    quiet: true
  when: stack.repo is defined

- name: "{{ stack.name }} | check out the Compose project from its own repository"
  ansible.builtin.git:
    repo: "{{ stack.repo }}"
    # A moving branch, not a tag: these stacks deploy what the branch says.
    version: "{{ stack.repo_version | default('main') }}"
    dest: "{{ stacks_root }}/{{ stack.name }}"
    force: true
    depth: 1
  register: stack_repo
  when: stack.repo is defined

- name: "{{ stack.name }} | create data directories"
  ansible.builtin.file:
    # An absolute path lives outside the Compose project, e.g. in a state dir.
    path: "{{ item.path if item.path.startswith('/') else stacks_root ~ '/' ~ stack.name ~ '/' ~ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ stack.dirs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

# stack_env_common applies even to stacks that declare no `env`.
- name: "{{ stack.name }} | render .env"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stacks_root }}/{{ stack.name }}/.env"
    mode: "0600"

- name: "{{ stack.name }} | render extra configuration files"
  ansible.builtin.template:
    src: "{{ item.template }}"
    # An absolute dest writes into a state dir instead of the project.
    dest: "{{ item.dest if item.dest.startswith('/') else stacks_root ~ '/' ~ stack.name ~ '/' ~ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
    # Only when the entry asks for it: a non-root container needs the owner set.
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ item.group | default(omit) }}"
    # `force: false` seeds the file once and leaves it to the service after that.
    force: "{{ item.force | default(true) | bool }}"
  loop: "{{ stack.files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: stack_files

# POSTGRES_* are read by the first initdb only, so a vault rotation has to be
# reconciled into the cluster or the app dies on 28P01.
- name: "{{ stack.name }} | reconcile the Postgres credentials"
  ansible.builtin.script: >-
    postgres-credentials.sh
    {{ stacks_root }}/{{ stack.name }}
    {{ stack.postgres.service }}
    {{ stack.postgres.container }}
    {{ stack.postgres.user_env }}
    {{ stack.postgres.password_env }}
    {{ stack.postgres.database_env }}
  register: postgres_creds
  changed_when: "'changed=1' in postgres_creds.stdout"
  when: stack.postgres is defined

# `up -d` only says the container started. The panel is the one stack whose
# failure is silent: a commit that breaks the import leaves it restarting
# forever and the playbook reporting success. Keep the image that is running as
# the rollback target first, so going back is a tag and not a rebuild.
- name: "{{ stack.name }} | bookmark the running image as the rollback target"
  ansible.builtin.command:
    cmd: docker image tag gpu-panel:local gpu-panel:rollback
  # A bookmark rather than a change, and the first run has nothing to keep.
  changed_when: false
  failed_when: false
  when: stack.name == 'gpu-panel'

# An on-demand stack is created but never started: the GPU panel owns its
# lifetime. Its image is still built, so a version bump applies now.
- name: "{{ stack.name }} | bring the stack up"
  ansible.builtin.command:
    cmd: >-
      docker compose {{ 'create' if stack.name in (stacks_on_demand | default([])) else 'up -d' }}
      --remove-orphans{{ ' --build' if stack.build | default(false) else '' }}
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  register: compose_up
  changed_when: >-
    'Started' in compose_up.stdout or 'Created' in compose_up.stdout
    or 'Recreated' in compose_up.stdout

# The image it just built is what the healthcheck judges: a container that
# cannot import its own app never turns healthy, and this is where that fails
# the run instead of waiting for someone to load the dashboard.
- name: "{{ stack.name }} | wait for the container to report healthy"
  ansible.builtin.command:
    cmd: "docker inspect -f '{% raw %}{{ .State.Health.Status }}{% endraw %}' gpu-panel"
  register: gpu_panel_health
  until: gpu_panel_health.stdout | default('') == 'healthy'
  retries: 12
  delay: 5
  changed_when: false
  when: stack.name == 'gpu-panel'

# Config files are bind mounted, so `up` alone would not pick up a rewrite.
- name: "{{ stack.name }} | restart after configuration changes"
  ansible.builtin.command:
    cmd: docker compose restart
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  # `restart` also starts a stopped container, which would take the card.
  when: >-
    (stack_files.changed | default(false)
     or stack_sync.changed | default(false)
     or stack_repo.changed | default(false))
    and stack.name not in (stacks_on_demand | default([]))
  changed_when: true

# Hermes writes state back into config.yaml, so windows go in through its CLI.
# Bifrost publishes none, and without them every model is assumed to be 128K.
- name: "{{ stack.name }} | read each profile's configuration"
  ansible.builtin.slurp:
    src: "{{ hermes_data_root }}/{{ ('' if item.key == 'default' else hermes_profiles_dir ~ '/' ~ item.key ~ '/') ~ 'config.yaml' }}"
  loop: "{{ hermes_agents | default({}) | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: hermes_cfg
  when: stack.name == 'hermes'

- name: "{{ stack.name }} | teach the agent each model's window"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "HERMES_HOME={{ hermes_home }}{{ '' if item.item.key == 'default' else '/' ~ hermes_profiles_dir ~ '/' ~ item.item.key }}"
      - "{{ stack.name }}"
      - hermes
      - config
      - set
      - "providers.{{ hermes_llm_provider }}.models"
      - "{{ llm_model_contexts | to_json }}"
  loop: "{{ hermes_cfg.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - stack.name == 'hermes'
    - >-
      ((item.content | b64decode | from_yaml).get('providers', {})
        .get(hermes_llm_provider, {}).get('models', {})) != (llm_model_contexts | default({}))
  changed_when: true
  register: hermes_ctx

# Same reason as the windows: the client deadline lives in hermes' own file.
- name: "{{ stack.name }} | give the agent the same deadline as the gateway"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "HERMES_HOME={{ hermes_home }}{{ '' if item.item.key == 'default' else '/' ~ hermes_profiles_dir ~ '/' ~ item.item.key }}"
      - "{{ stack.name }}"
      - hermes
      - config
      - set
      - "providers.{{ hermes_llm_provider }}.request_timeout_seconds"
      - "{{ hermes_request_timeout_s }}"
  loop: "{{ hermes_cfg.results | default([]) }}"
  loop_control:
    label: "{{ item.item.key }}"
  when:
    - stack.name == 'hermes'
    - >-
      ((item.content | b64decode | from_yaml).get('providers', {})
        .get(hermes_llm_provider, {}).get('request_timeout_seconds'))
      | int | default(0, true) != hermes_request_timeout_s | int
  changed_when: true
  register: hermes_timeout

# The gateway reads its config at start: the new key needs a restart.
- name: "{{ stack.name }} | restart once the windows changed"
  ansible.builtin.command:
    cmd: docker compose restart
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  when:
    - stack.name == 'hermes'
    - (hermes_ctx.results | default([]) | selectattr('changed') | list | length > 0)
      or (hermes_timeout.results | default([]) | selectattr('changed') | list | length > 0)
  changed_when: true

# The panel stays "Up" when it loses its network, and it answers 502 while the
# cards are unreachable: the healthcheck alone does not see either. This probes
# it from inside the CT, where 127.0.0.1 is the published port, and restarts the
# container when the answer is wrong.
- name: "{{ stack.name }} | install the panel's health probe"
  ansible.builtin.template:
    src: gpu-panel-watch.sh.j2
    dest: /usr/local/sbin/gpu-panel-watch.sh
    mode: "0755"
  when: stack.name == 'gpu-panel'

- name: "{{ stack.name }} | install the probe unit and its timer"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - gpu-panel-watch.service
    - gpu-panel-watch.timer
  when: stack.name == 'gpu-panel'

- name: "{{ stack.name }} | run the probe every two minutes"
  ansible.builtin.systemd:
    name: gpu-panel-watch.timer
    enabled: true
    state: started
    daemon_reload: true
  when: stack.name == 'gpu-panel'
