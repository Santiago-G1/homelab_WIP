---
- name: "{{ stack.name }} | create the project directory"
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ stack.name }}"
    state: directory
    mode: "0755"

# A file Ansible renders (a `files` dest) must not exist as a directory in the
# Compose source: rsync replaces the bind-mounted file on the host with that
# directory and the stack fails to start ("not a directory: Are you trying to
# mount a directory onto a file"). Empty directories are invisible to git,
# which is how one slipped in and took Blocky down; fail loudly instead.
- name: "{{ stack.name }} | assert no rendered file is a directory in the source"
  ansible.builtin.assert:
    that: not ((compose_src_root ~ '/' ~ stack.src ~ '/' ~ item.dest) is directory)
    fail_msg: >-
      {{ stack.src }}/{{ item.dest }} is a directory in the repo, but Ansible
      renders it as a file: delete it (empty directories are not tracked by
      git) or drop the `files` entry.
  loop: "{{ stack.files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  delegate_to: localhost
  when: stack.files is defined

# rsync (not copy) so the rendered .env is never overwritten by the repo's
# local .env, which would make the role flap between the two files.
- name: "{{ stack.name }} | sync the Compose project"
  ansible.posix.synchronize:
    src: "{{ compose_src_root }}/{{ stack.src }}/"
    dest: "{{ stacks_root }}/{{ stack.name }}/"
    delete: false
    rsync_opts:
      - "--exclude=.env"
      - "--exclude=.env.template"
      # Ownership and modes of runtime dirs are set by the `dirs` task below;
      # letting rsync manage them would fight over them on every run.
      - "--no-owner"
      - "--no-group"
      - "--no-perms"
      # Runtime dirs change while the stack runs; ignore their mtimes.
      - "--omit-dir-times"
  register: stack_sync

- name: "{{ stack.name }} | create data directories"
  ansible.builtin.file:
    path: "{{ stacks_root }}/{{ stack.name }}/{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop: "{{ stack.dirs | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

- name: "{{ stack.name }} | render .env"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ stacks_root }}/{{ stack.name }}/.env"
    mode: "0600"
  when: stack.env is defined

- name: "{{ stack.name }} | render extra configuration files"
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ stacks_root }}/{{ stack.name }}/{{ item.dest }}"
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ stack.files | default([]) }}"
  loop_control:
    label: "{{ item.dest }}"
  register: stack_files

# Images built from a Dockerfile in the project (a thin layer over an upstream
# image, or an image the service never runs directly). Services gated behind a
# Compose profile are built here on purpose: the profile keeps them out of
# `up`, and only their image is wanted. BuildKit prints its progress to stderr
# and reuses its cache, so the task reports changed only when a layer was
# actually rebuilt.
- name: "{{ stack.name }} | build the images declared for the stack"
  ansible.builtin.command:
    cmd: >-
      docker compose --profile {{ stack.build_profile | default('tools') }}
      build {{ stack.build_services | join(' ') }}
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  when: (stack.build_services | default([])) | length > 0
  register: stack_build
  changed_when: "'Successfully built' in stack_build.stdout"

- name: "{{ stack.name }} | bring the stack up"
  ansible.builtin.command:
    cmd: "docker compose up -d --remove-orphans{{ ' --build' if stack.build | default(false) else '' }}"
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  register: compose_up
  changed_when: >-
    'Started' in compose_up.stdout or 'Created' in compose_up.stdout
    or 'Recreated' in compose_up.stdout

# Configuration files are bind mounted, so `compose up` alone would not pick up
# a change; restart the containers when one of them was rewritten.
- name: "{{ stack.name }} | restart after configuration changes"
  ansible.builtin.command:
    cmd: docker compose restart
    chdir: "{{ stacks_root }}/{{ stack.name }}"
  when: stack_files.changed | default(false) or stack_sync.changed | default(false)
  changed_when: true

# LiteLLM stores a virtual key's model allowlist in its Postgres database, not
# in config.yaml, so re-deploying the stack alone cannot widen (or narrow) what
# a client may call. This reconciles each declared `agent_keys` entry against
# the repo through the admin API; the proxy is up by now (it is started above),
# and the call is a full state assignment, so it never reports a change. If the
# proxy is still migrating its schema, retry until it answers.
- name: "{{ stack.name }} | reconcile the virtual keys' model access"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ stack.admin_port | default(4000) }}/key/update"
    method: POST
    headers:
      Authorization: "Bearer {{ vault_litellm_master_key }}"
    body_format: json
    body:
      key: "{{ item.value }}"
      models: "{{ item.models }}"
    status_code: [200]
  loop: "{{ stack.agent_keys | default([]) }}"
  loop_control:
    label: agent key
  register: key_reconcile
  until: key_reconcile is succeeded
  retries: 12
  delay: 5
  no_log: true
  changed_when: false
  when: stack.agent_keys is defined
