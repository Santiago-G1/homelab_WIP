---
# A second swap device, so a full zramswap cannot freeze the host.
- name: Install the extra zram swap script
  ansible.builtin.template:
    src: zram-extra.sh.j2
    dest: /usr/local/sbin/zram-extra.sh
    mode: "0755"

- name: Install the unit
  ansible.builtin.template:
    src: zram-extra.service.j2
    dest: /etc/systemd/system/zram-extra.service
    mode: "0644"
  notify: Reload systemd

- name: Enable the unit and bring the extra swap up
  ansible.builtin.systemd:
    name: zram-extra.service
    enabled: true
    state: started
    daemon_reload: true
