---
# Host-level tuning: CPU frequency, IRQ distribution, ZFS page cache, scrub
# scheduling and the GPU power caps. Nothing here touches a container.

pve_tune_governor: schedutil

# ARC is reclaimable, so this costs the containers nothing.
pve_tune_arc_max_bytes: 3221225472

# ZFS commits every 5 s by default; a longer TXG gives the shingled disk
# longer sequential runs.
pve_tune_zfs_txg_timeout: 10

# One list for the modprobe file and for the running module.
pve_tune_zfs_params:
  zfs_arc_max: "{{ pve_tune_arc_max_bytes }}"
  zfs_txg_timeout: "{{ pve_tune_zfs_txg_timeout }}"

# Lowest cap that holds the 1328 MHz application clock on its own.
# 175 W, not 200: measured 7-nov on the 35B-A3B and the 27B, prefill and
# decode are within 0.3 % of 200 W (pp512 849.8 vs 852.0, pp4096 1317.3 vs
# 1317.7, tg 77.8 both) while the sustained draw drops 12.5 %. At 150 W the
# 35B prefill loses 3.7 % and at 125 W 10.7 %, so 175 is the free step.
pve_tune_gpu_power_limit_w: 175
pve_tune_gpu_clock_mem_mhz: 715    # HBM2 stock; never raise
pve_tune_gpu_clock_sm_mhz: 1328    # GP100 max boost

pve_tune_scrub_pool: tank
pve_tune_fstrim_on_calendar: "Sun *-*-* 03:30:00"

# Block queue: the SSD takes no elevator, the HDDs keep mq-deadline.
pve_tune_ssd_read_ahead_kb: 256
pve_tune_hdd_read_ahead_kb: 8192
pve_tune_hdd_nr_requests: 256

# The host resets without a shutdown sequence; this keeps the last few seconds
# on disk (RAM, pressure, ARC, temps, GPU) for the next one.
pve_tune_sampler_interval: 10
pve_tune_sampler_log: /var/log/homelab-sampler.csv
pve_tune_sampler_max_bytes: 8388608   # rotates once: two files, about a week
