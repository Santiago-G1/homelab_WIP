---
# Host-level tuning: CPU frequency, IRQ distribution, ZFS page cache, scrub
# scheduling and the GPU power caps. Nothing here touches a container.

pve_tune_governor: schedutil

# ARC is reclaimable; 3 GiB saves seeks on the HDD mirror.
pve_tune_arc_max_bytes: 3221225472

# Lowest cap that holds the 1328 MHz application clock on its own.
pve_tune_gpu_power_limit_w: 200
pve_tune_gpu_clock_mem_mhz: 715    # HBM2 stock; never raise
pve_tune_gpu_clock_sm_mhz: 1328    # GP100 max boost

pve_tune_scrub_pool: tank
pve_tune_fstrim_on_calendar: "Sun *-*-* 03:30:00"
